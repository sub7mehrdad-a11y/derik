<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#a8501f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json">
<title>دریک: راه‌های شاهی</title>
<style>
:root{--bg:#f3ecdd;--card:#fffdf7;--ink:#2b2118;--mute:#7a6a58;--line:#e2d6c0;--acc:#a8501f;--good:#2f7d4f;--bad:#b3362c;--sea:#bcd6de;--land:#ead9b4;--mtn:#c9b48a;--gov:#3b6ea5;--free:#d9822b;--tem:#8a4fa0}
@media (prefers-color-scheme:dark){:root{--bg:#171310;--card:#231c16;--ink:#f0e6d6;--mute:#a8998a;--line:#3a3027;--acc:#e08a52;--good:#6cc78f;--bad:#f07a6e;--sea:#1d2c33;--land:#3a3022;--mtn:#54452f;--gov:#6fa3d8;--free:#f0a050;--tem:#c08ad6}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,Tahoma,sans-serif}
main{max-width:1150px;margin:0 auto;padding:12px 16px}
.bar{display:flex;gap:6px 16px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.bar b{color:var(--acc)}.bar .sp{margin-inline-start:auto;display:flex;gap:4px}
.hint{margin:8px 0;padding:8px 12px;background:var(--card);border:1px dashed var(--acc);border-radius:10px;font-size:14px}
.layout{display:grid;grid-template-columns:1.1fr 1fr;gap:12px}
@media(max-width:860px){.layout{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
svg{width:100%;height:auto;display:block;border-radius:8px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:4px}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
button{font:inherit;font-size:13px;background:var(--acc);color:#fff;border:0;border-radius:6px;padding:3px 9px;cursor:pointer;margin:1px}
button.o{background:transparent;color:var(--acc);border:1px solid var(--acc)}button.on{outline:2px solid var(--ink)}button:disabled{opacity:.35;cursor:default}
input[type=number]{width:70px;font:inherit;padding:2px 4px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
select{font:inherit;font-size:13px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px}
table{width:100%;border-collapse:collapse}th,td{padding:4px 3px;text-align:right;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--mute);font-weight:500}
.up{color:var(--bad)}.dn{color:var(--good)}.m{color:var(--mute);font-size:12px}
.car{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px}.car.sel{border-color:var(--acc);border-width:2px}
.city,.bld{cursor:pointer}.cl{font-size:12px;text-anchor:middle;fill:var(--ink);font-weight:600;paint-order:stroke;stroke:var(--land);stroke-width:3px}
.pill rect{fill:var(--card);stroke:var(--line)}.pill text{font-size:12px;text-anchor:middle;fill:var(--ink);font-weight:600}
.bld:hover .pill rect{stroke:var(--acc)}
h2{font-size:15px;margin:0 0 6px}
#log div{padding:2px 0;border-bottom:1px dashed var(--line);font-size:13px}
.help{margin-top:8px}.help ol{margin:4px 0;padding-inline-start:20px}
.top{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
.ov .box{background:var(--card);border:2px solid var(--acc);border-radius:12px;padding:16px;max-width:460px;width:100%}
.ov h3{margin:0 0 6px;font-size:17px}.ov p{margin:0 0 10px}.ov button{display:block;width:100%;text-align:right;margin:4px 0;padding:8px 10px}
.fig{animation:walk 6s linear infinite}@keyframes walk{from{transform:translateX(0)}to{transform:translateX(-60px)}}
.cloud{animation:drift 40s linear infinite}@keyframes drift{from{transform:translateX(0)}to{transform:translateX(120px)}}
.flag{transform-origin:left;animation:wave 1.6s ease-in-out infinite alternate}@keyframes wave{to{transform:skewY(6deg)}}
@media(max-width:860px){
 main{padding:8px}body{font-size:14px}
 .bar{position:sticky;top:0;z-index:5;gap:4px 10px;padding:6px 8px;font-size:13px}.bar .sp{margin-inline-start:0;width:100%;justify-content:flex-end}
 button{min-height:36px;padding:4px 10px}nav{overflow-x:auto;flex-wrap:nowrap;white-space:nowrap;padding-bottom:4px}
 .panel-wrap{overflow-x:auto}table{min-width:520px}th,td{font-size:12px;padding:6px 3px}
 .hint{font-size:13px}.help ol{font-size:13px}input[type=number]{width:60px;min-height:34px}
}
</style></head><body><main>
<div class="bar" id="bar"></div>
<div class="hint" id="hint"></div>
<div class="layout">
 <section class="card"><div id="vtop" class="top"></div><svg id="map" viewBox="0 0 600 380"></svg><div class="legend" id="legend"></div></section>
 <section class="card"><nav id="tabs"></nav><div class="panel-wrap"><div id="panel"></div></div></section>
</div>
<div class="card help" id="help"></div>
<div id="ov"></div>
</main>
<script>
const G={grain:['غلات',8],date:['خرما',12],wool:['پشم',18],wine:['شراب',28],cedar:['چوب سدر',35],cloth:['منسوجات',40],metal:['فلز',50],argh:['ارغوان',110],lapis:['لاجورد',140]};
const GN=Object.keys(G);
const Z={gov:{n:'دولتی',tax:.10,rob:.5,col:'var(--gov)'},free:{n:'آزاد/مرزی',tax:.03,rob:2,col:'var(--free)'},temple:{n:'معبدی',tax:.06,rob:1,col:'var(--tem)'}};
const C={
 susa:{n:'شوش',x:403,y:136,z:'gov',p:['grain','cloth'],d:['argh','lapis','wine'],note:'پایتخت اداری داریوش با کاخ آپادانا و آجرهای لعابدار؛ مرکز فرمان‌ها و عوارض.'},
 parsa:{n:'پارسه',x:469,y:264,z:'gov',p:['wine','wool'],d:['cedar','metal','lapis','grain'],note:'تخت‌جمشید در حال ساخت: ایوان بزرگ آپادانا و دروازه همه‌ملت‌ها.'},
 sardis:{n:'سارد',x:75,y:96,z:'gov',p:['metal','cloth'],d:['grain','date','argh'],note:'پایتخت ساتراپی لیدیه، با دیوارهای کوه‌پایه، معبد ایونی و زرگران رود پکتولوس.'},
 babel:{n:'بابل',x:262,y:166,z:'temple',p:['grain','date'],d:['metal','cedar','wine'],note:'دروازه ایشتار آبی لعابدار و زیگورات اتمنانکی؛ خزانه معبد و خاندان‌های بانکی.'},
 sur:{n:'صور',x:103,y:222,z:'free',p:['argh','cedar'],d:['grain','wool','date'],note:'بندر فنیقی روی جزیره، با ستون‌های ملقارت و کارگاه‌های ارغوان.'},
 bakhtar:{n:'باختر',x:528,y:93,z:'free',p:['lapis','wool'],d:['cloth','wine','date'],note:'شهر باروبلند مرز شرقی در دامنه کوه‌های برفی، آغاز راه لاجورد.'}};
const ids=Object.keys(C);
const dist=(a,b)=>Math.max(2,Math.round(Math.hypot(C[a].x-C[b].x,C[a].y-C[b].y)/24));
const RANKS=[['دکان‌دار',0],['تاجر محلی',3000],['تاجر بین‌شهری',8000],['صاحب تجارت‌خانه',25000],['بازرگان ساتراپی',80000]];
const WHCAP=300,CAP=40,KEY='derik-v4';
const f=n=>(Math.round(n)||0).toLocaleString('fa');
const f1=n=>(Math.round(n*10)/10).toLocaleString('fa');
let S;
function eq(c,g){return C[c].p.includes(g)?120:C[c].d.includes(g)?20:60}
function price(c,g){const m=S.mod[g]&&(S.mod[g].c==c||S.mod[g].c=='all')?S.mod[g].f:1;
 return Math.max(1,Math.round(G[g][1]*m*Math.min(2.5,Math.max(.4,Math.pow(60/Math.max(8,S.st[c][g]),.5)))))}
function newCar(id){return{id,name:'کاروان '+id.toLocaleString('fa'),at:S.home,cargo:{},route:[],ri:0}}
function init(){
 S={v:3,day:1,acc:0,speed:0,gold:1000,home:'susa',st:{},seen:{},mod:{},wh:{},selCity:'susa',selCar:1,view:'world',tab:'market',qty:10,
  cars:[],nextCar:2,loom:false,land:false,landMode:'share',guard:false,news:[],won:0,tut:1,loans:[],nextLoan:1,silver:0,rate:1,deposit:0,rep:0,order:null,
  trades:[],pg:{},led:{buy:0,sell:0,tax:0,freight:0,wage:0,tribute:0,fine:0,fee:0,interest:0,idle:0,robbed:0,invest:0}};
 S.cars.push(newCar(1));
 ids.forEach(c=>{S.st[c]={};GN.forEach(g=>S.st[c][g]=eq(c,g)*(0.7+Math.random()*.6))});
 ids.forEach(c=>see(c));
 log('شما با ۱۰۰۰ دریک و یک دفتر کوچک در شوش شروع کردید.');
}
function see(c){S.seen[c]={day:S.day,p:Object.fromEntries(GN.map(g=>[g,price(c,g)]))}}
function log(t){S.news.unshift('روز '+S.day+': '+t);if(S.news.length>80)S.news.pop()}
const load=o=>Object.values(o).reduce((a,b)=>a+b.q,0);
function add(o,g,q,cost){const e=o[g]||(o[g]={q:0,c:0});e.c=(e.c*e.q+cost*q)/(e.q+q);e.q+=q}
function rem(o,g,q){const e=o[g];if(!e)return;e.q-=q;if(e.q<=0)delete o[g]}
const carAt=c=>S.cars.filter(x=>x.at==c);
const canTrade=c=>c==S.home||carAt(c).length>0;
const selC=()=>S.cars.find(x=>x.id==S.selCar);
function tradeTarget(){const c=S.selCity;
 if(c==S.home)return{store:S.wh,cap:WHCAP,label:'انبار شما'};
 const cs=carAt(c);const car=cs.find(x=>x.id==S.selCar)||cs[0];
 return car?{store:car.cargo,cap:CAP,label:car.name,car}:null}
function trade(t,c,g,q,total,tax,profit){S.trades.unshift({d:S.day,t,c,g,q,total,tax,profit});if(S.trades.length>300)S.trades.pop();if(t=='sell')S.pg[g]=(S.pg[g]||0)+profit}
function buy(g,n){const t=tradeTarget();if(!t)return;const c=S.selCity;
 n=Math.min(n,t.cap-load(t.store),Math.floor(S.st[c][g]));let k=0,cost=0;
 while(k<n){const p=price(c,g);if(S.gold<p)break;S.gold-=p;S.st[c][g]-=1;cost+=p;k++}
 if(!k)return;add(t.store,g,k,cost/k);S.led.buy+=cost;trade('buy',c,g,k,cost,0,0);see(c);render()}
function sell(g,n){const t=tradeTarget();if(!t||!t.store[g])return;const c=S.selCity;n=Math.min(n,t.store[g].q);if(n<=0)return;
 let rev=0;for(let i=0;i<n;i++){rev+=price(c,g);S.st[c][g]+=1}
 const tax=Math.round(rev*Z[C[c].z].tax),basis=t.store[g].c*n;S.gold+=rev-tax;S.led.sell+=rev;S.led.tax+=tax;
 trade('sell',c,g,n,rev,tax,rev-tax-basis);rem(t.store,g,n);see(c);render()}
function loadCar(g,n){const car=selC();if(!car||car.at!=S.home||!S.wh[g])return;
 n=Math.min(n,S.wh[g].q,CAP-load(car.cargo));if(n<=0)return;const c=S.wh[g].c;rem(S.wh,g,n);add(car.cargo,g,n,c);render()}
function unloadCar(g,n){const car=selC();if(!car||car.at!=S.home||!car.cargo[g])return;
 n=Math.min(n,car.cargo[g].q);const c=car.cargo[g].c;rem(car.cargo,g,n);add(S.wh,g,n,c);render()}
function dispatch(){const car=selC();if(!car||!car.at||!car.dest||car.dest==car.at||car.auto)return;
 log(car.name+' از '+C[car.at].n+' به '+C[car.dest].n+' حرکت کرد'+(load(car.cargo)?' با '+f(load(car.cargo))+' بار.':'.'));
 depart(car,car.dest);S.view='world';render()}
function depart(car,to){car.from=car.at;car.to=to;car.at=null;car.prog=0;car.tot=dist(car.from,to)}
function arrive(car){const to=car.to;car.at=to;delete car.to;
 const risk=Math.min(.3,car.tot*.01*(Z[C[car.from].z].rob+Z[C[to].z].rob)/2*(S.guard?.3:1));
 if(load(car.cargo)>0&&Math.random()<risk){const pct=.15+Math.random()*.2;let lost=0;
  Object.keys(car.cargo).forEach(g=>{const l=Math.floor(car.cargo[g].q*pct);lost+=l;S.led.robbed+=l*car.cargo[g].c;rem(car.cargo,g,l)});log('راهزنان به '+car.name+' زدند؛ '+f(lost)+' بار از دست رفت!')}
 log(car.name+' به '+C[to].n+' رسید.');see(to);
 if(car.auto)routeNext(car);else{S.selCity=to;S.selCar=car.id}render()}
function doOrders(car,st){
 if(st.c==S.home){Object.keys(car.cargo).forEach(g=>add(S.wh,g,car.cargo[g].q,car.cargo[g].c));car.cargo={}}
 else if(st.sell&&load(car.cargo)>0){const tax=Z[C[st.c].z].tax;let rev=0,basis=0;Object.keys(car.cargo).forEach(g=>{const q=car.cargo[g].q;let r=0;for(let i=0;i<q;i++){r+=price(st.c,g);S.st[st.c][g]+=1}
  const t=Math.round(r*tax);S.led.sell+=r;S.led.tax+=t;trade('sell',st.c,g,q,r,t,r-t-car.cargo[g].c*q);rev+=r-t});S.gold+=rev;log(car.name+' در '+C[st.c].n+' بار را فروخت: '+f(rev)+' دریک.');car.cargo={}}
 if(st.buy){const c=st.c;let k=0,cost=0;const n=Math.min(CAP-load(car.cargo),Math.floor(S.st[c][st.buy]));
  while(k<n){const p=price(c,st.buy);if(S.gold<p)break;S.gold-=p;S.st[c][st.buy]-=1;cost+=p;k++}
  if(k){add(car.cargo,st.buy,k,cost/k);S.led.buy+=cost;trade('buy',c,st.buy,k,cost,0,0);log(car.name+' '+f(k)+' بار '+G[st.buy][0]+' در '+C[c].n+' خرید.')}}
 see(st.c)}
function routeNext(car){const R=car.route;if(R.length<2){car.auto=false;return}
 let st=R[car.ri%R.length];
 if(car.at==st.c){doOrders(car,st);car.ri=(car.ri+1)%R.length;st=R[car.ri]}
 if(st.c==car.at){car.auto=false;return}
 depart(car,st.c)}
function addStop(c){const k=selC();if(k){k.route.push({c,buy:'',sell:true});render()}}
function delStop(i){const k=selC();k.route.splice(i,1);k.ri=0;render()}
function setBuy(i,g){selC().route[i].buy=g}
function toggleSell(i){const r=selC().route[i];r.sell=!r.sell}
function clearRoute(){const k=selC();k.route=[];k.auto=false;render()}
function startRoute(){const k=selC();if(!k||!k.at||k.route.length<2)return;k.auto=true;k.ri=0;routeNext(k);render()}
function stopRoute(){selC().auto=false;render()}
function ask(title,text,opts){S.choice={title,text,opts:opts.map(o=>o.t)};S._fns=opts.map(o=>o.fn);S.speed=0;render()}
function choose(i){const fn=S._fns&&S._fns[i];S.choice=null;S._fns=null;if(fn)fn();render()}
const anyCar=()=>S.cars.find(c=>c.at&&c.at!=S.home&&load(c.cargo)>0)||S.cars.find(c=>c.at);
function event(){const r=Math.random(),pick=a=>a[Math.floor(Math.random()*a.length)];
 const E=[
  ()=>{S.mod.grain={c:'all',f:1.5,t:40};log('خبر: خشکسالی! قیمت غلات همه‌جا بالا رفت.')},
  ()=>{const c=pick(['parsa','susa']);S.mod.wine={c,f:2,t:25};log('خبر: سفر شاه به '+C[c].n+'؛ تقاضای شراب دو برابر شد.')},
  ()=>{S.mod.argh={c:'babel',f:.6,t:20};log('خبر: جشن معبد بابل؛ ارغوان در بابل ارزان شد.')},
  ()=>{S.mod.lapis={c:'all',f:1.4,t:30};log('خبر: راه خراسان ناامن شد؛ لاجورد کمیاب است.')},
  ()=>{if(S.gold>800){const x=Math.round(S.gold*.02);S.gold-=x;S.led.fine+=x;log('بازرسی چشم‌وگوش شاه: جریمه '+f(x)+' دریک.')}},
  ()=>{S.mod.cedar={c:'parsa',f:1.8,t:35};S.mod.metal={c:'parsa',f:1.5,t:35};log('خبر: ساخت آپادانای پارسه شتاب گرفت؛ چوب سدر و فلز در پارسه گران شد.')},
  ()=>{S.mod.grain={c:'babel',f:1.6,t:25};S.mod.date={c:'babel',f:1.4,t:25};log('خبر: طغیان فرات مزارع بابل را گرفت؛ غلات و خرما در بابل گران شد.')},
  ()=>{S.mod.lapis={c:'bakhtar',f:.6,t:30};log('خبر: رگه تازه لاجورد در کوه‌های باختر؛ لاجورد در باختر ارزان شد.')},
  ()=>{S.mod.cloth={c:'all',f:1.3,t:20};S.mod.argh={c:'all',f:1.3,t:20};log('خبر: نوروز نزدیک است؛ منسوجات و ارغوان همه‌جا پرتقاضا شد.')},
  ()=>{S.mod.cedar={c:'sur',f:1.5,t:20};log('خبر: طوفان دریا کشتی‌های سدر را به صور نرساند؛ چوب سدر در صور گران شد.')},
  ()=>{const c=pick(ids),g=pick(GN);see(c);log('پیک شاهی از '+C[c].n+' گذشت: قیمت‌های '+C[c].n+' به‌روز شد (تب انبار ← بهترین مقصد).')},
  ()=>{const car=anyCar();if(!car||!car.at)return;const g=pick(GN),q=5+Math.floor(Math.random()*8);const room=(car.at==S.home?WHCAP-load(S.wh):CAP-load(car.cargo));if(room<q)return;
   ask('بار رهاشده','در راه '+C[car.at].n+' بار کاروانی رهاشده پیدا شد: '+f(q)+' بار '+G[g][0]+'. می‌توانید برش دارید، اما اگر صاحبش پیدا شود باید غرامت بدهید.',[
    {t:'برمی‌دارم',fn:()=>{add(car.at==S.home?S.wh:car.cargo,g,q,0);if(Math.random()<.3){const x=Math.round(G[g][1]*q*1.2);S.gold-=x;S.led.fine+=x;log('صاحب بار پیدا شد و '+f(x)+' دریک غرامت گرفت!')}else log(f(q)+' بار '+G[g][0]+' رایگان به دست آمد.')}},
    {t:'به کاروانسرا تحویل می‌دهم (+۱ اعتبار)',fn:()=>{S.rep=Math.min(6,S.rep+1);log('بار را تحویل دادید؛ اعتبارتان نزد معبد بالا رفت.')}}])},
  ()=>{const car=S.cars.find(c=>c.at&&load(c.cargo)>0);if(!car)return;const g=pick(Object.keys(car.cargo)),e=car.cargo[g],p=Math.round(e.c*1.25);
   ask('تاجر رهگذر','تاجری در '+C[car.at].n+' می‌خواهد '+f(e.q)+' بار '+G[g][0]+' شما را نقد و بدون عوارض بخرد: هر بار '+f(p)+' دریک (قیمت تمام‌شده شما '+f1(e.c)+').',[
    {t:'می‌فروشم ('+f(p*e.q)+' دریک)',fn:()=>{S.gold+=p*e.q;S.led.sell+=p*e.q;trade('sell',car.at,g,e.q,p*e.q,0,(p-e.c)*e.q);rem(car.cargo,g,e.q);log('بار به تاجر رهگذر فروخته شد.')}},
    {t:'نمی‌فروشم',fn:()=>{}}])},
  ()=>{const car=S.cars.find(c=>!c.at);if(!car)return;
   ask('بازرس راه','در راه '+C[car.to].n+' بازرسی راه کاروان را نگه داشته و «هدیه» می‌خواهد: ۸۰ دریک. در غیر این صورت کاروان دو روز معطل می‌شود.',[
    {t:'۸۰ دریک می‌دهم',fn:()=>{S.gold-=80;S.led.fine+=80;log('هدیه داده شد؛ کاروان ادامه داد.')}},
    {t:'نمی‌دهم (۲ روز تأخیر)',fn:()=>{car.prog=Math.max(0,car.prog-2);log('کاروان دو روز معطل شد.')}}])},

function invCost(){let w=0;Object.keys(S.wh).forEach(g=>w+=S.wh[g].q*S.wh[g].c);S.cars.forEach(c=>Object.keys(c.cargo).forEach(g=>w+=c.cargo[g].q*c.cargo[g].c));return w}

function curOwed(l){const late=Math.pow(1.05,l.late||0);
 if(l.fixed)return Math.round(l.fixed*late);if(l.kind=='temple')return Math.round(l.amt*1.05*late);

 if(S.gold>=o){S.gold-=o;S.led.interest+=o-l.amt;if(!l.late)S.rep=Math.min(6,S.rep+1);S.loans=S.loans.filter(x=>x.id!=l.id);log('سررسید: '+f(o)+' دریک به طلبکار پرداخت شد.')}

   h+=ks.length?'<table><tr><th>کالا</th><th>تعداد</th><th>قیمت تمام‌شده (هر واحد)</th><th>جمع هزینه</th><th>ارزش در شهر فعلی</th></tr>'+ks.map(g=>{const e=c.cargo[g];const v=c.at&&canTrade(c.at)?price(c.at,g)*e.q:null;return`<tr><td>${G[g][0]}</td><td>${f(e.q)}</td><td>${f1(e.c)}</td><td>${f(e.c*e.q)}</td><td>${v==null?'—':f(v)}</td></tr>`}).join('')+`<tr><th>جمع</th><th>${f(load(c.cargo))}</th><th></th><th>${f(ks.reduce((a,g)=>a+c.cargo[g].c*c.cargo[g].q,0))}</th><th></th></tr></table><div class="m">قیمت تمام‌شده = قیمت خرید + سهم هزینه روزانه کاروان در راه.</div>`:'<p class="m">بار ندارد.</p>';
   if(c.at==S.home&&!c.auto){h+=`<div style="margin:6px 0">مقدار: <input type="number" min="1" value="${S.qty}" onchange="setQty(this.value)"> انتقال از انبار به کاروان:</div>`+(Object.keys(S.wh).map(g=>`<div>${G[g][0]} در انبار: ${f(S.wh[g].q)} <button onclick="loadCar('${g}',S.qty)">بارگیری</button><button class="o" onclick="loadCar('${g}',9999)">همه</button></div>`).join('')||'<div class="m">انبار خالی است.</div>')+
     (ks.length?'<div class="m" style="margin-top:4px">برگرداندن به انبار:</div>'+ks.map(g=>`<div>${G[g][0]} <button class="o" onclick="unloadCar('${g}',S.qty)">پیاده</button><button class="o" onclick="unloadCar('${g}',9999)">همه</button></div>`).join(''):'')}
   else if(c.at&&!c.auto)h+=`<div class="m" style="margin-top:6px">برای خرید و فروش وارد ${C[c.at].n} شوید و روی «بازار» بزنید. بار شما خودکار خالی نمی‌شود.</div> <button class="o" onclick="enter('${c.at}')">ورود به ${C[c.at].n}</button>`;
   if(c.at&&!c.auto){h+='<div class="m" style="margin-top:6px">مقصد:</div>'+ids.filter(x=>x!=c.at).map(x=>`<button class="${c.dest==x?'':'o'}" onclick="setDest('${x}')">${C[x].n} (${f(dist(c.at,x))} روز)</button>`).join('');
    if(c.dest&&c.dest!=c.at)h+=`<div style="margin-top:6px"><button onclick="dispatch()">حرکت به ${C[c.dest].n}</button> <span class="m">هر روز راه ۳ دریک هزینه دارد.</span></div>`}
   h+=routeHTML(c)}
  h+='</div>'});
 return h+`<button class="o" onclick="build('car')" ${S.gold<800?'disabled':''}>خرید کاروان جدید (۸۰۰)</button>`}
function routeHTML(c){let h='<div class="m" style="margin-top:8px;border-top:1px solid var(--line);padding-top:6px"><b>مسیر ثابت (خودکار)</b>: ایستگاه‌ها را تکرار می‌کند. در هر ایستگاه (غیر از شوش) بار را می‌فروشد و کالای انتخابی را می‌خرد. در شوش بار به انبار تحویل می‌شود.</div>';
 h+=c.route.map((r,i)=>`<div style="margin:4px 0">${f(i+1)}. <b>${C[r.c].n}</b> ${c.auto&&c.ri==i?'<span class="m">(بعدی)</span>':''} · خرید: <select onchange="setBuy(${i},this.value)" ${c.auto?'disabled':''}><option value="">هیچ</option>${GN.map(g=>`<option value="${g}" ${r.buy==g?'selected':''}>${G[g][0]}</option>`).join('')}</select> <label><input type="checkbox" ${r.sell?'checked':''} onchange="toggleSell(${i})" ${c.auto?'disabled':''}> فروش کل بار</label> ${c.auto?'':`<button class="o" onclick="delStop(${i})">✕</button>`}</div>`).join('');
 if(!c.auto)h+='<div class="m">افزودن ایستگاه:</div>'+ids.map(x=>`<button class="o" onclick="addStop('${x}')">${C[x].n}</button>`).join('');
 h+='<div style="margin-top:6px">'+(c.auto?'<span class="dn">مسیر فعال است</span> <button class="o" onclick="stopRoute()">توقف مسیر</button>':`<button onclick="startRoute()" ${c.at&&c.route.length>1?'':'disabled'}>شروع مسیر</button> <button class="o" onclick="clearRoute()">پاک‌کردن</button>`)+'</div>';
 return h}
function statsHTML(){const L=S.led,inv=invCost(),cap=S.gold+S.deposit+S.silver*S.rate+inv-debts(),start=1000;
 const over=L.idle+L.wage+L.tribute+L.fine+L.fee+L.interest+L.robbed;
 const tradeProfit=Object.values(S.pg).reduce((a,b)=>a+b,0);
 let h=`<h2>آمار و حساب‌وکتاب</h2><table><tr><td>سرمایه اولیه</td><td>${f(start)}</td></tr><tr><td>صندوق (نقد)</td><td>${f(S.gold)}</td></tr><tr><td>پول بسته‌شده در کالاها (به قیمت تمام‌شده)</td><td>${f(inv)}</td></tr><tr><td>سپرده و نقره</td><td>${f(S.deposit+S.silver*S.rate)}</td></tr><tr><td>بدهی</td><td>${f(-debts())}</td></tr><tr><th>سرمایه کل کنونی</th><th>${f(cap)}</th></tr><tr><th>سود/زیان واقعی از ابتدا</th><th class="${cap-start>=0?'dn':'up'}">${cap-start>=0?'+':''}${f(cap-start)}</th></tr></table>
 <div class="m">اگر صندوقتان کم شده ولی «پول بسته‌شده در کالاها» زیاد است، پولتان از بین نرفته؛ هنوز نفروخته‌اید.</div>
 <h2 style="margin-top:10px">چرا پول می‌رود؟ (هزینه‌ها از ابتدا)</h2><table>
 <tr><td>سود فروش‌های انجام‌شده (پس از عوارض و هزینه راه)</td><td class="${tradeProfit>=0?'dn':'up'}">${tradeProfit>=0?'+':''}${f(tradeProfit)}</td></tr>
 <tr><td>عوارض فروش پرداختی</td><td class="up">${f(-L.tax)}</td></tr>
 <tr><td>هزینه روزانه کاروان (در سفر با بار، داخل قیمت تمام‌شده)</td><td class="up">${f(-L.freight)}</td></tr>
 <tr><td>کاروان خالی در راه</td><td class="up">${f(-L.idle)}</td></tr>
 <tr><td>دستمزد کارگاه</td><td class="up">${f(-L.wage)}</td></tr>
 <tr><td>خراج ساتراپی</td><td class="up">${f(-L.tribute)}</td></tr>
 <tr><td>جریمه‌ها</td><td class="up">${f(-L.fine)}</td></tr>
 <tr><td>بهره وام و کارمزد سپرده</td><td class="up">${f(-(L.interest+L.fee))}</td></tr>
 <tr><td>بار از دست رفته به راهزنان (به قیمت خرید)</td><td class="up">${f(-L.robbed)}</td></tr>
 <tr><td>خرید دارایی (کاروان، کارگاه، زمین، نگهبان)</td><td class="up">${f(-L.invest)}</td></tr></table>`;
 const gs=Object.keys(S.pg);
 if(gs.length)h+='<h2 style="margin-top:10px">سود هر کالا</h2><table>'+gs.map(g=>`<tr><td>${G[g][0]}</td><td class="${S.pg[g]>=0?'dn':'up'}">${S.pg[g]>=0?'+':''}${f(S.pg[g])}</td></tr>`).join('')+'</table>';
 h+='<h2 style="margin-top:10px">آخرین معاملات</h2>';
 h+=S.trades.length?'<table><tr><th>روز</th><th>شهر</th><th></th><th>کالا</th><th>تعداد</th><th>مبلغ</th><th>سود</th></tr>'+S.trades.slice(0,30).map(t=>`<tr><td>${f(t.d)}</td><td>${C[t.c].n}</td><td>${t.t=='buy'?'خرید':'فروش'}</td><td>${G[t.g][0]}</td><td>${f(t.q)}</td><td>${f(t.total)}</td><td class="${t.profit>=0?'dn':'up'}">${t.t=='sell'?(t.profit>=0?'+':'')+f(t.profit):'—'}</td></tr>`).join('')+'</table>':'<p class="m">هنوز معامله‌ای نکرده‌اید.</p>';
 return h}
function finHTML(){const L=S.loans||[];let h=`<h2>مالی در دوران داریوش</h2><div class="m">اعتبار نزد معبد: ${'★'.repeat(S.rep)+'☆'.repeat(6-S.rep)} · سقف وام: ${f(lim())} · بدهی: ${f(debts())}</div>`;
 h+=L.map(l=>`<div class="car"><b>${l.kind=='temple'?'وام خزانه معبد':'قرارداد هرّانو'}</b> · اصل ${f(l.amt)} · سررسید ${f(l.due-S.day)} روز دیگر${l.late?' <span class="up">عقب‌افتاده</span>':''}<br>تسویه امروز: <b>${f(curOwed(l))}</b> <button onclick="repay(${l.id})" ${S.gold<curOwed(l)?'disabled':''}>پرداخت</button></div>`).join('')||'<p class="m">بدهی ندارید.</p>';
 const ok=!overdue(),b=(k,a)=>`<button class="o" ${ok&&principal()+a<=lim()?'':'disabled'} onclick="takeLoan('${k}',${a})">${f(a)}</button>`;
 h+=`<h2 style="margin-top:10px">وام از معبد</h2><div class="m">۵٪ سود برای ۶۰ روز. پرداخت به‌موقع اعتبار را بالا می‌برد؛ تأخیر ۲ ستاره کم می‌کند و معبد از انبارتان برمی‌دارد.</div>`+[500,1000,2000].map(a=>b('temple',a)).join('');
 h+=`<h2 style="margin-top:10px">هرّانو (شراکت سفر)</h2><div class="m">خاندان بازرگان سرمایه می‌دهد؛ ۴۰٪ سود مال او، و در ضرر نیمی از ضرر با اوست. ۴۵ روز.</div>`+[1000,2500].map(a=>b('harranu',a)).join('');
 h+=`<h2 style="margin-top:10px">سپرده در معبد</h2><div class="m">پول امن می‌ماند ولی ماهی ۱٪ کارمزد دارد. موجود: <b>${f(S.deposit)}</b></div><button class="o" onclick="dep(500)">+۵۰۰</button><button class="o" onclick="dep(2000)">+۲۰۰۰</button><button class="o" onclick="wdr()" ${S.deposit?'':'disabled'}>برداشت همه</button>`;
 h+=`<h2 style="margin-top:10px">صرافی (نقره و دریک)</h2><div class="m">هر مثقال نقره = <b class="${S.rate>1?'up':'dn'}">${S.rate.toFixed(2).replace('.','٫')}</b> دریک (با ۲٪ کارمزد). موجود: ${f(S.silver)} مثقال</div><button class="o" onclick="buySilver(500)">خرید با ۵۰۰</button><button class="o" onclick="sellSilver(500)" ${S.silver?'':'disabled'}>فروش ۵۰۰ مثقال</button><button class="o" onclick="sellSilver(1e9)" ${S.silver?'':'disabled'}>فروش همه</button>`;
 const nx=90-S.day%90;h+=`<h2 style="margin-top:10px">خراج ساتراپی</h2><div class="m">هر ۹۰ روز ۳٪ ثروت شما به خزانه می‌رود؛ ${f(nx)} روز دیگر.</div>`;
 const o=S.order;h+=`<h2 style="margin-top:10px">فرمان شاه</h2>`+(o?`<div class="car">${f(o.q)} بار ${G[o.g][0]} به انبار شوش تا ${f(o.due-S.day)} روز دیگر. قیمت خرید دربار: <b>${f(o.price)}</b> برای هر بار.<br>در انبار دارید: ${f(S.wh[o.g]?S.wh[o.g].q:0)} <button onclick="deliver()" ${S.wh[o.g]&&S.wh[o.g].q>=o.q?'':'disabled'}>تحویل</button></div>`:'<p class="m">فعلاً فرمانی نیست.</p>');
 return h+'<p class="m">اعداد نمونه‌اند و در بازی‌آزمایی تنظیم می‌شوند.</p>'}
function shopHTML(){return`<h2>خزانه شاهی: خرید دریک</h2><p class="m">نمونه آزمایشی: پرداخت واقعی هنوز وصل نیست و دکمه‌ها چیزی اضافه نمی‌کنند. در نسخه نهایی دریک خریداری‌شده به کیف‌پول مشترک بزرگمهر می‌رود.</p>`+[['کیسه کوچک',500],['صندوق بازرگان',2500],['خزانه ساتراپ',12000]].map(([n,a])=>`<div class="car"><b>${n}</b> · ${f(a)} دریک <button class="o" onclick="S.note='پرداخت واقعی در نسخه نهایی وصل می‌شود.';render()">خرید</button></div>`).join('')}
function bizHTML(){return`<h2>کارگاه و دارایی (شوش)</h2>
 <button onclick="build('guard')" ${S.guard||S.gold<300?'disabled':''}>نگهبان ۳۰۰ ${S.guard?'✓':''}</button>
 <button onclick="build('loom')" ${S.loom||S.gold<1200?'disabled':''}>بافندگی ۱۲۰۰ ${S.loom?'✓':''}</button>
 <button onclick="build('land')" ${S.land||S.gold<1500?'disabled':''}>زمین ۱۵۰۰ ${S.land?'✓':''}</button>
 <p class="m">بافندگی: روزانه ۱۵ دریک دستمزد؛ ۸ پشم از انبار را به ۴ منسوج تبدیل می‌کند. زمین: ماهی یک‌بار غلات یا ۹۰ دریک.</p>
 ${S.land?`<button class="o" onclick="build('mode')">قرارداد: ${S.landMode=='share'?'سهم‌بری (پرنوسان)':'اجاره ثابت (مطمئن)'}</button>`:''}
 <p class="m">نگهبان خطر راهزنی همه کاروان‌ها را ۷۰٪ کم می‌کند.</p>`}
function render(){document.getElementById('ov').innerHTML=S.choice?`<div class="ov"><div class="box"><h3>${S.choice.title}</h3><p>${S.choice.text}</p>${S.choice.opts.map((t,i)=>`<button onclick="choose(${i})">${t}</button>`).join('')}</div></div>`:'';updateBar();document.getElementById('hint').textContent=hint();
 const city=S.view=='city';
 document.getElementById('map').innerHTML=city?citySVG(S.selCity):worldSVG();
 document.getElementById('vtop').innerHTML=city?`<button class="o" onclick="leave()">← بازگشت به نقشه</button><b>${C[S.selCity].n}</b><span class="m">${Z[C[S.selCity].z].n}</span>`:'<b>نقشه امپراتوری</b><span class="m">روی شهر بزنید تا وارد شوید</span>';
 document.getElementById('legend').innerHTML=(city?`<span class="dn">تولید این شهر: ${C[S.selCity].p.map(g=>G[g][0]).join('، ')}</span><span class="up">نیاز این شهر: ${C[S.selCity].d.map(g=>G[g][0]).join('، ')}</span><span>${S.note||C[S.selCity].note}</span>`:'')+(city?'':'<span><i style="background:var(--gov)"></i>دولتی</span><span><i style="background:var(--free)"></i>آزاد/مرزی</span><span><i style="background:var(--tem)"></i>معبدی</span><span>★ شهر شما · 🐪 کاروان</span>');
 drawCars();
 const T=[['market','بازار'],['cars','کاروان‌ها'],['wh','انبار'],['stats','آمار'],['fin','مالی'],['biz','کارگاه'],['shop','خزانه'],['news','اخبار']];
 document.getElementById('tabs').innerHTML=T.map(([k,n])=>`<button class="${S.tab==k?'':'o'}" onclick="tab('${k}')">${n}</button>`).join('');
 document.getElementById('panel').innerHTML=S.tab=='market'?marketHTML():S.tab=='wh'?whHTML():S.tab=='cars'?carsHTML():S.tab=='stats'?statsHTML():S.tab=='fin'?finHTML():S.tab=='biz'?bizHTML():S.tab=='shop'?shopHTML():'<div id="log">'+S.news.map(t=>'<div>'+t+'</div>').join('')+'</div>';
 document.getElementById('help').innerHTML=S.tut?`<b>راهنمای سریع</b><ol><li>روی <b>شوش ★</b> بزنید تا وارد شهر شوید. ساختمان‌ها دکمه‌اند: بازار، انبار، معبد، کاروانسرا.</li><li>در «بازار» شوش کالای ارزان بخرید؛ به انبار شما می‌رود. جدول بازار نشان می‌دهد چقدر دارید و قیمت تمام‌شده‌تان چند است.</li><li>در «کاروان‌ها» از انبار بار بگذارید، مقصد را بزنید و حرکت کنید. هزینه سفر روزی ۳ دریک است.</li><li>در شهر مقصد وارد شهر شوید و در بازار هر مقدار خواستید بفروشید یا بخرید؛ پول فروش نقد به صندوق می‌آید و بار خودکار خالی نمی‌شود.</li><li>تب «آمار» نشان می‌دهد پول کجا رفته و سودتان چقدر است.</li></ol><button class="o" onclick="S.tut=0;render()">بستن راهنما</button>`:''}
function boot(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.v==3)S=s}catch(e){}if(!S)init();S.speed=0;S.view=S.view||'world';render()}
let last=performance.now();
setInterval(()=>{const n=performance.now(),dt=(n-last)/1000;last=n;if(S.speed>0&&!document.hidden&&!S.choice){step(dt*.5*S.speed)}drawCars();if(S.speed>0)updateBar()},100);
boot();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
