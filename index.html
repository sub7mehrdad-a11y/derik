<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#a8501f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json">
<title>دریک: راه‌های شاهی</title>
<style>
:root{--bg:#f3ecdd;--card:#fffdf7;--ink:#2b2118;--mute:#7a6a58;--line:#e2d6c0;--acc:#a8501f;--good:#2f7d4f;--bad:#b3362c;--sea:#bcd6de;--land:#ead9b4;--mtn:#c9b48a;--gov:#3b6ea5;--free:#d9822b;--tem:#8a4fa0}
@media (prefers-color-scheme:dark){:root{--bg:#171310;--card:#231c16;--ink:#f0e6d6;--mute:#a8998a;--line:#3a3027;--acc:#e08a52;--good:#6cc78f;--bad:#f07a6e;--sea:#1d2c33;--land:#3a3022;--mtn:#54452f;--gov:#6fa3d8;--free:#f0a050;--tem:#c08ad6}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,Tahoma,sans-serif;-webkit-text-size-adjust:100%}
#hud{position:fixed;top:0;left:0;right:0;height:46px;z-index:20;display:flex;align-items:center;gap:6px;padding:0 8px;padding-top:env(safe-area-inset-top);background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 2px 8px #0003;font-size:13px;white-space:nowrap;overflow:hidden}
#hud b{color:var(--acc)}#hud .sp{margin-inline-start:auto;display:flex;gap:3px}
#hud .shop{font-size:13px;padding:5px 9px}
#vp{position:fixed;top:46px;left:0;right:0;bottom:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;background:#d9c79a;cursor:grab}
#vp:active{cursor:grabbing}
#map{width:100%;height:100%;display:block}
button{font:inherit;font-size:13px;background:var(--acc);color:#fff;border:0;border-radius:8px;padding:5px 11px;cursor:pointer;margin:2px;touch-action:manipulation;min-height:34px}
button.o{background:transparent;color:var(--acc);border:1px solid var(--acc)}button.on{outline:2px solid var(--ink)}button:disabled{opacity:.35;cursor:default}
.fab{position:fixed;z-index:15;display:flex;flex-direction:column;gap:6px}
.fab button{width:40px;height:40px;padding:0;border-radius:50%;font-size:20px;margin:0;box-shadow:0 2px 8px #0005}
.fab.fl{left:10px;top:58px}.fab.fr{right:10px;top:58px}
.fab .wide{width:auto;border-radius:20px;padding:0 14px;font-size:13px}
.chips{position:fixed;right:10px;top:104px;z-index:14;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.chips button{background:var(--card);color:var(--ink);border:1px solid var(--acc);box-shadow:0 2px 6px #0004;font-size:12px;min-height:30px;padding:3px 10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:12;max-width:min(92vw,520px);background:#2b2118e6;color:#fff6e0;border-radius:12px;padding:8px 12px;font-size:13px;display:flex;gap:8px;align-items:flex-start;box-shadow:0 3px 12px #0006}
#toast:empty,#toast.off{display:none}#toast span{flex:1}#toast button{background:#ffffff22;min-height:26px;padding:0 8px;margin:0}
#sheet{position:fixed;z-index:25;left:50%;bottom:0;width:100%;max-width:640px;max-height:58dvh;max-height:58vh;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -6px 24px #0006;transform:translate(-50%,105%);transition:transform .22s ease;padding-bottom:env(safe-area-inset-bottom)}
#sheet.open{transform:translate(-50%,0)}
#sheet.col #sbody,#sheet.col #schips{display:none}
#shead{display:flex;align-items:center;gap:8px;padding:10px 14px 6px;cursor:pointer;flex:0 0 auto}
#shead:before{content:"";position:absolute;top:5px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:2px;background:var(--line)}
#shead h2{margin:0;font-size:16px;flex:1}
#shead button{width:32px;height:32px;padding:0;border-radius:50%;margin:0}
#schips{display:flex;gap:4px;overflow-x:auto;padding:0 10px 6px;flex:0 0 auto;scrollbar-width:none}
#schips button{flex:0 0 auto;font-size:12px;padding:3px 10px;min-height:30px}
#sbody{overflow-y:auto;overflow-x:hidden;padding:2px 14px 16px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;flex:1 1 auto}
#sbody table{width:100%;border-collapse:collapse}
input[type=number]{width:70px;font:inherit;padding:3px 5px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
select{font:inherit;font-size:13px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;max-width:100%}
th,td{padding:4px 3px;text-align:right;border-bottom:1px solid var(--line);font-size:12px}th{color:var(--mute);font-weight:500}
.up{color:var(--bad)}.dn{color:var(--good)}.m{color:var(--mute);font-size:12px}
.car{border:1px solid var(--line);border-radius:10px;padding:8px;margin:0 0 8px}.car.sel{border-color:var(--acc);border-width:2px}.car.ev{border-color:var(--acc);background:#fff4e0}
@media (prefers-color-scheme:dark){.car.ev{background:#2f2418}}
h2{font-size:15px;margin:0 0 6px}p{margin:4px 0 8px}
.gd{border-bottom:1px solid var(--line);padding:6px 0}.gh{display:flex;align-items:center;gap:6px}.gh .pr{margin-inline-start:auto;font-weight:700;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}.grid div{border:1px solid var(--line);border-radius:10px;padding:6px 8px}.grid b{display:block;font-size:15px}
.tags{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin:4px 0 8px}
.bar2{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:4px 0}.bar2 i{display:block;height:100%;background:var(--acc)}
#log div{padding:3px 0;border-bottom:1px dashed var(--line);font-size:13px}
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.ov .box{background:var(--card);border:2px solid var(--acc);border-radius:14px;padding:16px;max-width:460px;width:100%;max-height:86vh;overflow:auto}
.ov h3{margin:0 0 6px;font-size:17px}.ov p{margin:0 0 10px}.ov button{display:block;width:100%;text-align:right;margin:4px 0;padding:9px 10px}
#map text{pointer-events:none}
#map .cl{font-size:7.5px;text-anchor:middle;fill:var(--ink);font-weight:700;paint-order:stroke;stroke:var(--land);stroke-width:2.2px}
#map .cl.art{fill:#fff6e0;stroke:#2b1d10;stroke-width:2.2px}
#map .cl.sb{font-size:5.6px;stroke-width:1.8px}
#map .city,#map .bld{cursor:pointer}
.hit:hover .hr{fill:#ffffff33;stroke:#fff}
.fig{animation:walk 6s linear infinite}@keyframes walk{from{transform:translateX(0)}to{transform:translateX(-60px)}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.25)}}
@media(max-width:480px){#hud{gap:4px;padding:0 6px;font-size:12px}#hud button{padding:3px 7px;min-height:32px}}
#sbody>h2:first-child{display:none}
</style></head><body>
<div id="hud"></div>
<div id="vp"><svg id="map" viewBox="0 0 600 380" preserveAspectRatio="xMidYMid meet"></svg></div>
<div class="fab fl" id="zoomfab"><button onclick="zoomBtn(1.35)">＋</button><button onclick="zoomBtn(1/1.35)">－</button><button onclick="fitBtn()" title="مرکز">◎</button></div>
<div class="fab fr" id="backfab"></div>
<div class="chips" id="chips"></div>
<div id="toast"></div>
<div id="sheet"><div id="shead"></div><div id="schips"></div><div id="sbody"></div></div>
<div id="ov"></div>
<script>
const G={grain:['غلات',8],date:['خرما',12],wool:['پشم',18],wine:['شراب',28],cedar:['چوب سدر',35],cloth:['منسوجات',40],metal:['فلز',50],argh:['ارغوان',110],lapis:['لاجورد',140]};
const GN=Object.keys(G);
const Z={gov:{n:'دولتی',tax:.10,rob:.5,col:'var(--gov)'},free:{n:'آزاد/مرزی',tax:.03,rob:2,col:'var(--free)'},temple:{n:'معبدی',tax:.06,rob:1,col:'var(--tem)'}};
const C={
 susa:{n:'شوش',x:273,y:292,z:'gov',p:['grain','cloth'],d:['argh','lapis','wine'],note:'پایتخت اداری داریوش با کاخ آپادانا و آجرهای لعابدار؛ مرکز فرمان‌ها و عوارض.'},
 parsa:{n:'پارسه',x:352,y:337,z:'gov',p:['wine','wool'],d:['cedar','metal','lapis','grain'],note:'تخت‌جمشید در حال ساخت: ایوان بزرگ آپادانا و دروازه همه‌ملت‌ها.'},
 sardis:{n:'سارد',x:91,y:215,z:'gov',p:['metal','cloth'],d:['grain','date','argh'],note:'پایتخت ساتراپی لیدیه، با دیوارهای کوه‌پایه، معبد ایونی و زرگران رود پکتولوس.'},
 babel:{n:'بابل',x:213,y:287,z:'temple',p:['grain','date'],d:['metal','cedar','wine'],note:'دروازه ایشتار آبی لعابدار و زیگورات اتمنانکی؛ خزانه معبد و خاندان‌های بانکی.'},
 sur:{n:'صور',x:127,y:275,z:'free',p:['argh','cedar'],d:['grain','wool','date'],note:'بندر فنیقی روی جزیره، با ستون‌های ملقارت و کارگاه‌های ارغوان.'},
 bakhtar:{n:'باختر',x:433,y:225,z:'free',p:['lapis','wool'],d:['cloth','wine','date'],note:'شهر باروبلند مرز شرقی در دامنه کوه‌های برفی، آغاز راه لاجورد.'}};
const ids=Object.keys(C);
const dist=(a,b)=>Math.max(2,Math.round(Math.hypot(C[a].x-C[b].x,C[a].y-C[b].y)/16));
const RANKS=[['دکان‌دار',0],['تاجر محلی',3000],['تاجر بین‌شهری',8000],['صاحب تجارت‌خانه',25000],['بازرگان ساتراپی',80000]];
const WHCAP=300,CAP=40,KEY='derik-v5';
const PT={
 farm:{n:'مزرعه / چراگاه',ic:'🌾',cost:1500,wage:0,desc:'هر ۳۰ روز محصول اصلی شهر را می‌دهد. قرارداد سهم‌بری (محصول، پرنوسان) یا اجاره ثابت (۹۰ دریک نقد).'},
 loom:{n:'بافندگی',ic:'🧵',cost:1200,wage:15,in:{wool:8},out:{cloth:4},desc:'روزانه ۸ پشم از انبار همین شهر را به ۴ منسوجات تبدیل می‌کند. دستمزد روزی ۱۵.'},
 winery:{n:'شراب‌سازی',ic:'🍇',cost:1500,wage:20,out:{wine:3},cities:['parsa','sardis'],desc:'روزانه ۳ شراب به انبار این شهر. دستمزد ۲۰.'},
 smith:{n:'فلزکاری',ic:'⚒️',cost:2000,wage:30,out:{metal:2},cities:['sardis','bakhtar'],desc:'روزانه ۲ فلز. دستمزد ۳۰.'},
 dye:{n:'رنگرزی ارغوان',ic:'🐚',cost:2800,wage:35,out:{argh:1},cities:['sur'],desc:'روزانه ۱ ارغوان از صدف دریایی. دستمزد ۳۵.'},
 mine:{n:'معدن لاجورد',ic:'💎',cost:3500,wage:40,out:{lapis:1},cities:['bakhtar'],desc:'روزانه ۱ لاجورد. دستمزد ۴۰.'},
 cedar:{n:'انبار چوب',ic:'🪵',cost:1800,wage:25,out:{cedar:2},cities:['sur'],desc:'روزانه ۲ چوب سدر از کشتی‌های لبنان. دستمزد ۲۵.'},
 store:{n:'انبار بزرگ',ic:'🏚️',cost:1500,wage:0,cap:300,desc:'ظرفیت انبار این شهر را ۳۰۰ بار بیشتر می‌کند.'}};
const BIZ={susa:['آسیاب شاهی','🌾'],babel:['کارگاه خرماپزی','🌴'],sur:['کارگاه ارغوان','🐚'],parsa:['تاکستان دربار','🍇'],sardis:['زرگرخانه پکتولوس','⚒️'],bakhtar:['معدن کوهستان','💎']};
const BOSS={gov:['دیوان ساتراپ','🏛️'],temple:['خزانه معبد','⚖️'],free:['شورای بازرگانان','🤝']};
const farmGood=c=>['grain','date','wine','wool'].find(g=>C[c].p.includes(g))||'grain';
const newProps=(c,home)=>({house:true,wh:{},whCap:home?WHCAP:200,plots:[null,null,null,null,null,null],shares:0});
const propsOf=c=>S.props[c];
const whOf=c=>S.props[c]?S.props[c].wh:null;
const whCap=c=>S.props[c]?S.props[c].whCap+S.props[c].plots.filter(x=>x&&x.t=='store').length*300:0;
const f=n=>(Math.round(n)||0).toLocaleString('fa');
const f1=n=>(Math.round(n*10)/10).toLocaleString('fa');
let S,IMG=false;
function eq(c,g){return C[c].p.includes(g)?120:C[c].d.includes(g)?20:60}
function price(c,g){const m=S.mod[g]&&(S.mod[g].c==c||S.mod[g].c=='all')?S.mod[g].f:1;
 return Math.max(1,Math.round(G[g][1]*m*Math.min(2.5,Math.max(.4,Math.pow(60/Math.max(8,S.st[c][g]),.5)))))}
function newCar(id){return{id,name:'کاروان شتر '+id.toLocaleString('fa'),at:S.home,cargo:{},route:[],ri:0,lv:0,up:S.day}}
function init(home){
 S={v:5,ev:[],out:[],perk:{},nextEv:1,sheet:false,day:1,acc:0,speed:0,gold:1000,home:null,st:{},seen:{},mod:{},wh:{},props:{},selCity:'susa',selCar:1,view:'world',tab:'market',qty:10,tgt:'wh',
  cars:[],nextCar:2,guard:false,news:[],won:0,tut:1,loans:[],nextLoan:1,silver:0,rate:1,deposit:0,rep:0,order:null,
  trades:[],pg:{},led:{buy:0,sell:0,tax:0,freight:0,wage:0,tribute:0,fine:0,fee:0,interest:0,idle:0,robbed:0,invest:0}};
 ids.forEach(c=>{S.st[c]={};GN.forEach(g=>S.st[c][g]=eq(c,g)*(0.7+Math.random()*.6))});
 ids.forEach(c=>see(c));
 if(home)setHome(home);
}
function setHome(c){S.home=c;S.selCity=c;S.props[c]=newProps(c,true);S.wh=S.props[c].wh;S.cars=[newCar(1)];
 const z=C[c].z;if(z=='gov')S.gold=1200;else if(z=='free'){S.gold=900;add(S.wh,C[c].p[0],12,G[C[c].p[0]][1]*.7)}else{S.gold=1000;S.rep=2}
 log('شما شهروند '+C[c].n+' شدید و با '+f(S.gold)+' دریک و یک دفتر کوچک شروع کردید.');save()}

function see(c){S.seen[c]={day:S.day,p:Object.fromEntries(GN.map(g=>[g,price(c,g)]))}}
function log(t){S.news.unshift('روز '+S.day+': '+t);if(S.news.length>80)S.news.pop()}
const load=o=>Object.values(o).reduce((a,b)=>a+b.q,0);
function add(o,g,q,cost){const e=o[g]||(o[g]={q:0,c:0});e.c=(e.c*e.q+cost*q)/(e.q+q);e.q+=q}
function rem(o,g,q){const e=o[g];if(!e)return;e.q-=q;if(e.q<=0)delete o[g]}
const carAt=c=>S.cars.filter(x=>x.at==c);
const canTrade=c=>!!(c==S.home||carAt(c).length>0||(S.props[c]&&S.props[c].house));
const selC=()=>S.cars.find(x=>x.id==S.selCar);
function tradeTarget(){const c=S.selCity,P=propsOf(c),cs=carAt(c),car=cs.find(x=>x.id==S.selCar)||cs[0];
 const useWh=P&&(S.tgt=='wh'||!car);
 if(useWh)return{store:P.wh,cap:whCap(c),label:'انبار شما در '+C[c].n,wh:true};
 return car?{store:car.cargo,cap:carCap(car),label:car.name,car}:null}
function trade(t,c,g,q,total,tax,profit){S.trades.unshift({d:S.day,t,c,g,q,total,tax,profit});if(S.trades.length>300)S.trades.pop();if(t=='sell')S.pg[g]=(S.pg[g]||0)+profit}
function buy(g,n){const t=tradeTarget();if(!t)return;const c=S.selCity;
 n=Math.min(n,t.cap-load(t.store),Math.floor(S.st[c][g]));let k=0,cost=0;
 while(k<n){const p=price(c,g);if(S.gold<p)break;S.gold-=p;S.st[c][g]-=1;cost+=p;k++}
 if(!k)return;add(t.store,g,k,cost/k);S.led.buy+=cost;trade('buy',c,g,k,cost,0,0);see(c);render()}
function sell(g,n){const t=tradeTarget();if(!t||!t.store[g])return;const c=S.selCity;n=Math.min(n,t.store[g].q);if(n<=0)return;
 let rev=0;for(let i=0;i<n;i++){rev+=price(c,g);S.st[c][g]+=1}
 const tax=Math.round(rev*taxOf(c)),basis=t.store[g].c*n;S.gold+=rev-tax;S.led.sell+=rev;S.led.tax+=tax;
 trade('sell',c,g,n,rev,tax,rev-tax-basis);rem(t.store,g,n);see(c);render()}
function loadCar(g,n){const car=selC();if(!car||!car.at)return;const W=whOf(car.at);if(!W||!W[g])return;
 n=Math.min(n,W[g].q,carCap(car)-load(car.cargo));if(n<=0)return;const c=W[g].c;rem(W,g,n);add(car.cargo,g,n,c);render()}
function unloadCar(g,n){const car=selC();if(!car||!car.at||!car.cargo[g])return;const W=whOf(car.at);if(!W)return;
 n=Math.min(n,car.cargo[g].q,whCap(car.at)-load(W));if(n<=0)return;const c=car.cargo[g].c;rem(car.cargo,g,n);add(W,g,n,c);render()}
function dispatch(){const car=selC();if(!car||!car.at||!car.dest||car.dest==car.at||car.auto)return;
 log(car.name+' از '+C[car.at].n+' به '+C[car.dest].n+' حرکت کرد'+(load(car.cargo)?' با '+f(load(car.cargo))+' بار.':'.'));
 depart(car,car.dest);S.view='world';S.sheet=false;render()}
function depart(car,to){car.from=car.at;car.to=to;car.at=null;car.prog=0;car.tot=dist(car.from,to)}
function arrive(car){const to=car.to;car.at=to;delete car.to;
 const risk=Math.min(.3,car.tot*.01*(Z[C[car.from].z].rob+Z[C[to].z].rob)/2*(S.guard?.3:1));
 if(load(car.cargo)>0&&Math.random()<risk){const pct=.15+Math.random()*.2;let lost=0;
  Object.keys(car.cargo).forEach(g=>{const l=Math.floor(car.cargo[g].q*pct);lost+=l;S.led.robbed+=l*car.cargo[g].c;rem(car.cargo,g,l)});log('راهزنان به '+car.name+' زدند؛ '+f(lost)+' بار از دست رفت!')}
 log(car.name+' به '+C[to].n+' رسید.');see(to);
 if(car.auto)routeNext(car);else{S.selCity=to;S.selCar=car.id}render()}
function doOrders(car,st){
 if(st.c==S.home||(st.deliver&&whOf(st.c))){const W=whOf(st.c);Object.keys(car.cargo).forEach(g=>add(W,g,car.cargo[g].q,car.cargo[g].c));car.cargo={}}
 else if(st.sell&&load(car.cargo)>0){const tax=taxOf(st.c);let rev=0,basis=0;Object.keys(car.cargo).forEach(g=>{const q=car.cargo[g].q;let r=0;for(let i=0;i<q;i++){r+=price(st.c,g);S.st[st.c][g]+=1}
  const t=Math.round(r*tax);S.led.sell+=r;S.led.tax+=t;trade('sell',st.c,g,q,r,t,r-t-car.cargo[g].c*q);rev+=r-t});S.gold+=rev;log(car.name+' در '+C[st.c].n+' بار را فروخت: '+f(rev)+' دریک.');car.cargo={}}
 if(st.buy){const c=st.c;let k=0,cost=0;const n=Math.min(carCap(car)-load(car.cargo),Math.floor(S.st[c][st.buy]));
  while(k<n){const p=price(c,st.buy);if(S.gold<p)break;S.gold-=p;S.st[c][st.buy]-=1;cost+=p;k++}
  if(k){add(car.cargo,st.buy,k,cost/k);S.led.buy+=cost;trade('buy',c,st.buy,k,cost,0,0);log(car.name+' '+f(k)+' بار '+G[st.buy][0]+' در '+C[c].n+' خرید.')}}
 see(st.c)}
function routeNext(car){const R=car.route;if(R.length<2){car.auto=false;return}
 let st=R[car.ri%R.length];
 if(car.at==st.c){doOrders(car,st);car.ri=(car.ri+1)%R.length;st=R[car.ri]}
 if(st.c==car.at){car.auto=false;return}
 depart(car,st.c)}

 S.cars.forEach(c=>{const sel=c.id==S.selCar;

function helpHTML(){return`<ol style="padding-inline-start:18px;margin:4px 0"><li>نقشه را با انگشت بکشید و با دو انگشت (یا با دکمه‌های ＋ و －) بزرگ و کوچک کنید.</li><li>روی هر شهر بزنید تا خلاصه‌اش را ببینید؛ «ورود به شهر» شما را به نقشه شهر می‌برد.</li><li>در شهر روی ساختمان‌ها بزنید: بازار برای قیمت دقیق و خرید و فروش، معبد برای وام، کاروانسرا برای کاروان، خانه برای انبار. زمین‌های خط‌چین قابل ساخت‌اند.</li><li>«دکان من» داشبورد کسب‌وکار شماست: کاروان‌ها، انبارها، مالی و آمار.</li><li>نمادهای 🎉 🕌 ⚓ 🪵 روی شهرها یعنی مراسم یا درخواست ویژه؛ جایزه‌اش اعتبار و امتیاز است.</li><li>کاروان‌ها بعد از ۲۰ روز قابل ارتقا هستند.</li></ol>`+(S.nohint?'<button class="o" onclick="S.nohint=0;render()">نمایش دوباره راهنمای کوتاه</button> ':'')+(S.askReset?'<button onclick="reset()">بله، از اول شروع شود</button><button class="o" onclick="S.askReset=0;render()">نه</button>':'<button class="o" onclick="S.askReset=1;render()">⟲ شروع دوباره بازی</button>')}
function updateToast(){const t=document.getElementById('toast');const msg=!S.home?'شهر خانگی را انتخاب کنید: روی هر شهر بزنید. نقشه را بکشید و با دو انگشت بزرگ و کوچک کنید.':(S.nohint?'':hint());
 if(!msg||S.sheet||S.choice){t.innerHTML='';return}t.innerHTML=`<span>${msg}</span>${S.home?'<button onclick="S.nohint=1;render()">✕</button>':''}`}

function boot(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.v==5){S=s;S.ev=S.ev||[];S.out=S.out||[];S.perk=S.perk||{};S.nextEv=S.nextEv||1;S.sheet=false;S.view='world';if(S.home)S.wh=S.props[S.home].wh}}catch(e){}if(!S)init();S.speed=0;S.view=S.view||'world';render()}
let last=performance.now();
setInterval(()=>{const n=performance.now(),dt=(n-last)/1000;last=n;if(S.speed>0&&!document.hidden&&!S.choice){step(dt*.5*S.speed)}drawCars();if(S.speed>0)updateBar()},100);
boot();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
