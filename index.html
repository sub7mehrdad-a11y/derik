 if(kind=='rep'){S.rep=Math.min(6,S.rep+tier+1);log('اعانه شما به '+e.n+' پذیرفته شد؛ +'+f(tier+1)+' ستاره اعتبار معبد.')}
 if(kind=='tax'){P.tax=Math.max(P.tax||0,S.day)+[30,60,120][tier];log('کاهنان '+C[c].n+' شما را تا روز '+f(P.tax)+' از عوارض فروش معاف کردند.')}
 if(kind=='disc'){P.disc={pct:[20,35,50][tier],until:S.day+90};log('تا ۹۰ روز خرید خانه، زمین و کارگاه در '+C[c].n+' برای شما '+f(P.disc.pct)+'٪ ارزان‌تر است.')}
 render()}
function lendCity(id,amt){const e=S.evs.find(x=>x.id==id);if(!e||e.done||S.gold<amt)return;S.gold-=amt;e.done=amt;
 S.clo.push({c:e.c,n:e.n,amt,ret:Math.round(amt*(1+e.rate)),due:S.day+e.term});log(f(amt)+' دریک به شورای '+C[e.c].n+' قرض دادید؛ روز '+f(S.day+e.term)+' با سود برمی‌گردد.');render()}
function evTick(){
 S.evs.forEach(e=>{if(e.t=='fest'&&S.day==e.end)log('🎉 '+e.n+' در '+C[e.c].n+' آغاز شد! کاروانی که در شهر باشد در جشن شرکت می‌کند.');
  if(e.t=='fest'&&!e.att&&S.day>=e.end&&S.day<=e.end+2&&carAt(e.c).length){e.att=true;S.fame=Math.min(10,S.fame+1);S.rep=Math.min(6,S.rep+1);log('🎉 شما در '+e.n+' '+C[e.c].n+' حاضر بودید و شاه از شما یاد کرد: +۱ آوازه و +۱ اعتبار.')}});
 S.evs=S.evs.filter(e=>{if(S.day<=(e.t=='fest'?e.end+2:e.end))return true;
  if(e.needs){const tot=e.needs.reduce((a,n)=>a+n.q,0),got=e.needs.reduce((a,n)=>a+n.got,0);if(got>=tot*.3){S.fame=Math.min(10,S.fame+1);log(EVI(e)+' سهم بزرگ شما در '+e.n+' دیده شد: +۱ آوازه.')}}
  return false});
 S.clo=S.clo.filter(l=>{if(S.day<l.due)return true;
  if(!l.late&&Math.random()<.12){l.late=1;l.due+=30;l.ret=Math.round(l.ret*1.1);log('شورای '+C[l.c].n+' بازپرداخت قرضه را ۳۰ روز عقب انداخت؛ ۱۰٪ بیشتر می‌پردازد.');return true}
  S.gold+=l.ret;S.led.cityInt+=l.ret-l.amt;log('شورای '+C[l.c].n+' قرضه را برگرداند: '+f(l.ret)+' دریک.');return false});
 if((S.day%8==0||S.day==3)&&S.evs.length<3)newEvent()}
function dayTick(){S.day++;
 ids.forEach(c=>GN.forEach(g=>{S.st[c][g]=Math.max(0,S.st[c][g]+(eq(c,g)-S.st[c][g])*.04+(Math.random()-.5)*.8)}));
 Object.keys(S.mod).forEach(g=>{if(--S.mod[g].t<=0)delete S.mod[g]});
 ids.forEach(c=>{if(canTrade(c))see(c)});
 S.cars.forEach(c=>{if(!c.at){const dc=dayCost(c);S.gold-=dc;const L=load(c.cargo);if(L>0){S.led.freight+=dc;Object.keys(c.cargo).forEach(g=>c.cargo[g].c+=dc/L)}else S.led.idle+=dc}});
 produce();loanTick();evTick();
 S.rate=Math.min(1.3,Math.max(.8,S.rate+(1-S.rate)*.04+(Math.random()-.5)*.04));
 if(S.day%30==0&&S.deposit>0){const fee=Math.round(S.deposit*.01);S.deposit-=fee;S.led.fee+=fee;log('کارمزد نگهداری سپرده معبد: '+f(fee)+' دریک.')}
 if(S.day%90==0){const x=Math.round(Math.max(0,grossWorth())*.03);payOrSeize(x);S.led.tribute+=x;log('خراج ساتراپی: '+f(x)+' دریک پرداخت شد.')}
 if(S.order&&S.day>S.order.due){S.rep=Math.max(0,S.rep-1);log('فرمان شاه را به‌موقع تحویل ندادید؛ اعتبارتان کم شد.');S.order=null}
 if(!S.order&&S.day%20==0){const g=pick(GN);S.order={g,q:10+5*Math.floor(Math.random()*3),due:S.day+40,price:Math.round(G[g][1]*1.4)};log('فرمان شاه: '+f(S.order.q)+' بار '+G[g][0]+' به انبار '+C[S.home].n+' تا روز '+f(S.order.due)+'.')}
 if(!S.choice&&Math.random()<.1)event();
 if(RANKS[S.won+1]&&netWorth()>=RANKS[S.won+1][1]){S.won++;log('ارتقا! اکنون «'+RANKS[S.won][0]+'» هستید.')}
 save();render()}
function produce(){ids.forEach(c=>{const P=S.props[c];if(!P)return;
 P.plots.forEach(pl=>{if(!pl)return;const T=PT[pl.t];
  if(T.wage){S.gold-=T.wage;S.led.wage+=T.wage}
  if(T.out){if(C[c].z=='temple'&&S.day%4==0)return;const k=(pl.t=='loom'&&S.loomBoost&&S.day<S.loomBoost)?2:1;
   for(let i=0;i<k;i++){let ok=true;Object.keys(T.in||{}).forEach(g=>{if(!P.wh[g]||P.wh[g].q<T.in[g])ok=false});if(!ok)break;
    if(load(P.wh)>=whCap(c)){if(S.day%10==0)log('انبار '+C[c].n+' پر است؛ کارگاه تولید نمی‌کند.');break}
    let cost=T.wage;Object.keys(T.in||{}).forEach(g=>{cost+=P.wh[g].c*T.in[g];rem(P.wh,g,T.in[g])});
    const units=Object.values(T.out).reduce((a,b)=>a+b,0);Object.keys(T.out).forEach(g=>add(P.wh,g,T.out[g],cost/units))}}
  if(pl.t=='farm'&&S.day%30==0){const g=farmGood(c);if(pl.mode=='rent'){S.gold+=90;log('اجاره مزرعه '+C[c].n+': ۹۰ دریک.')}
   else{let y=Math.round(20*(0.4+Math.random()*1.4));if(C[c].z=='temple')y=Math.round(y*.75);y=Math.min(y,Math.max(0,whCap(c)-load(P.wh)));add(P.wh,g,y,G[g][1]*.3);log('سهم‌بری مزرعه '+C[c].n+': '+f(y)+' بار '+G[g][0]+'.')}}});
 if(P.shares&&S.day%30==0){const r=Math.random();let d=Math.round(P.shares*1000*(0.02+r*0.04));if(r<.05){d=-Math.round(P.shares*1000*.1);log(BIZ[c][0]+' ماه بدی داشت: '+f(-d)+' دریک زیان سهم شما.')}else log('سود سهم '+BIZ[c][0]+': '+f(d)+' دریک.');S.gold+=d}})}
function step(d){d=Math.min(d,.5);S.cars.forEach(c=>{if(!c.at){c.prog+=d;if(c.prog>=c.tot)arrive(c)}});S.acc+=d;while(S.acc>=1){S.acc-=1;dayTick()}}
function netWorth(){return grossWorth()-debts()}
function invCost(){let w=0;Object.values(S.props).forEach(P=>Object.keys(P.wh).forEach(g=>w+=P.wh[g].q*P.wh[g].c));S.cars.forEach(c=>Object.keys(c.cargo).forEach(g=>w+=c.cargo[g].q*c.cargo[g].c));return w}
function grossWorth(){let w=S.gold+(S.deposit||0)+(S.silver||0)*(S.rate||1)+(S.clo||[]).reduce((a,l)=>a+l.amt,0);Object.values(S.props).forEach(P=>{Object.keys(P.wh).forEach(g=>w+=P.wh[g].q*G[g][1]);w+=P.shares*800});
 S.cars.forEach(c=>Object.keys(c.cargo).forEach(g=>w+=c.cargo[g].q*G[g][1]));return w}
function curOwed(l){const late=Math.pow(1.05,l.late||0);
 if(l.fixed)return Math.round(l.fixed*late);if(l.kind=='temple')return Math.round(l.amt*1.05*late);
 const profit=grossWorth()-l.nw0-l.amt;
 const o=profit>0?l.amt+.4*profit:l.amt*(1-.5*Math.min(1,-profit/l.amt));
 return Math.round(o*late)}
function debts(){return(S.loans||[]).reduce((a,l)=>a+curOwed(l),0)}
function overdue(){return(S.loans||[]).some(l=>l.late)}
function lim(){return Math.max(1000,Math.round(grossWorth()*(.5+.05*Math.min(6,S.rep||0)+.03*S.fame)))}
function principal(){return(S.loans||[]).reduce((a,l)=>a+l.amt,0)}
function takeLoan(kind,amt){if(overdue()||principal()+amt>lim())return;
 const l={id:S.nextLoan++,kind,amt,start:S.day,due:S.day+(kind=='temple'?60:45),nw0:grossWorth(),late:0};
 S.loans.push(l);S.gold+=amt;log(kind=='temple'?'وام '+f(amt)+' دریک از خزانه معبد گرفتید (سررسید ۶۰ روز).':'قرارداد هرّانو با خاندان بازرگان: '+f(amt)+' دریک سرمایه (۴۵ روز).');render()}
function repay(id){const l=S.loans.find(x=>x.id==id);if(!l)return;const o=curOwed(l);if(S.gold<o)return;S.gold-=o;S.led.interest+=o-l.amt;if(!l.late)S.rep=Math.min(6,S.rep+1);S.loans=S.loans.filter(x=>x.id!=id);log('بدهی '+f(o)+' دریک پرداخت شد.');render()}
function loanTick(){(S.loans||[]).slice().forEach(l=>{if(S.day<l.due)return;let o=curOwed(l);
 if(S.gold<o){Object.keys(S.wh).forEach(g=>{while(S.gold<o&&S.wh[g]){const q=Math.min(S.wh[g].q,10);S.gold+=Math.round(q*G[g][1]*.7);rem(S.wh,g,q);log('طلبکار '+f(q)+' بار '+G[g][0]+' را از انبار شما برداشت.')}})}
 if(S.gold>=o){S.gold-=o;S.led.interest+=o-l.amt;if(!l.late)S.rep=Math.min(6,S.rep+1);S.loans=S.loans.filter(x=>x.id!=l.id);log('سررسید: '+f(o)+' دریک به طلبکار پرداخت شد.')}
 else{if(!l.late)S.rep=Math.max(0,S.rep-2);l.late=(l.late||0)+1;l.due=S.day+30;log('بدهی عقب افتاد! ۵٪ جریمه؛ تا پرداخت نمی‌توانید وام تازه بگیرید.')}})}
function payOrSeize(x){if(S.gold<x){Object.keys(S.wh).forEach(g=>{while(S.gold<x&&S.wh[g]){const q=Math.min(S.wh[g].q,10);S.gold+=Math.round(q*G[g][1]*.7);rem(S.wh,g,q)}})}S.gold-=x}
function dep(n){n=Math.min(n,Math.floor(S.gold));if(n<=0)return;S.gold-=n;S.deposit+=n;render()}
function wdr(){S.gold+=S.deposit;S.deposit=0;render()}
function buySilver(d){d=Math.min(d,Math.floor(S.gold));if(d<=0)return;S.gold-=d;S.silver+=d/S.rate*.98;render()}
function sellSilver(u){u=Math.min(u,S.silver);if(u<=0)return;S.silver-=u;S.gold+=u*S.rate*.98;render()}
function deliver(){const o=S.order;if(!o||!S.wh[o.g]||S.wh[o.g].q<o.q)return;rem(S.wh,o.g,o.q);S.gold+=o.price*o.q;S.rep=Math.min(6,S.rep+1);log('فرمان شاه تحویل شد: '+f(o.price*o.q)+' دریک پاداش.');S.order=null;render()}
function build(k,c){c=c||S.selCity;
 if(k=='guard'&&S.gold>=300&&!S.guard){S.gold-=300;S.led.invest+=300;S.guard=true;log('نگهبان استخدام شد؛ خطر راهزنی ۷۰٪ کمتر.')}
 if(k=='car'&&S.gold>=800){S.gold-=800;S.led.invest+=800;const n=newCar(S.nextCar);n.at=c;S.cars.push(n);S.selCar=S.nextCar++;log('کاروان تازه در '+C[c].n+' خریدید.')}
 render()}
function buyHouse(c){const cost=houseCost(c);if(S.props[c]||S.gold<cost||!carAt(c).length)return;S.gold-=cost;S.led.invest+=cost;S.props[c]=newProps(c,false);log('خانه و انبار در '+C[c].n+' خریدید. حالا بدون کاروان هم این‌جا خرید و فروش می‌کنید.');render()}
function plotCost(c,t){return Math.round((PT[t].cost+(C[c].z=='gov'&&S.fame<3?300:0))*discF(c))}
function canBuild(c,t){const T=PT[t];return !T.cities||T.cities.includes(c)}
function buildPlot(c,i,t){const P=S.props[c];if(!P||P.plots[i]||!canBuild(c,t))return;const cost=plotCost(c,t);if(S.gold<cost)return;S.gold-=cost;S.led.invest+=cost;P.plots[i]={t,mode:'share'};log(PT[t].n+' در '+C[c].n+' ساخته شد.');render()}
function sellPlot(c,i){const P=S.props[c],pl=P&&P.plots[i];if(!pl)return;const v=Math.round(PT[pl.t].cost*.5);S.gold+=v;P.plots[i]=null;log(PT[pl.t].n+' فروخته شد: '+f(v)+' دریک.');render()}
function toggleMode(c,i){const pl=S.props[c].plots[i];pl.mode=pl.mode=='share'?'rent':'share';render()}
function buyShare(c){const P=S.props[c];if(!P||P.shares>=5||S.gold<1000)return;S.gold-=1000;S.led.invest+=1000;P.shares++;log('یک سهم '+BIZ[c][0]+' خریدید.');render()}
function sellShare(c){const P=S.props[c];if(!P||!P.shares)return;P.shares--;S.gold+=800;log('یک سهم '+BIZ[c][0]+' فروختید: ۸۰۰ دریک.');render()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

 el.style.left=Math.max(8,Math.min(innerWidth-248,x-120))+'px';el.style.top=Math.max(60,y-190)+'px'}

const GK=.46,GC=([x,y,w,h])=>[300*(1-GK)+x*GK,190*(1-GK)+y*GK,w*GK,h*GK];
function srnd(c){let x=0;for(const ch of c)x=(x*31+ch.charCodeAt(0))%9973;return()=>{x=(x*9301+49297)%233280;return x/233280}}
function scenery(c){const p=PAL[c],rnd=srnd(c),out=(x,y)=>x<300*(1-GK)-6||x>600-300*(1-GK)+6||y<190*(1-GK)-6||y>380-190*(1-GK)+6;let m=R(0,0,600,380,p.gr)+`<defs><pattern id="fld" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,8 L8,0" stroke="#0002" stroke-width="1"/></pattern><pattern id="crop" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0,3 H6" stroke="#5f7a2a55" stroke-width="2"/></pattern></defs>`;
 for(let i=0;i<40;i++){const w=30+rnd()*50,h=18+rnd()*30,x=rnd()*(600-w),y=rnd()*(380-h);if(!out(x,y)||!out(x+w,y+h)||!out(x+w,y)||!out(x,y+h))continue;m+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${rnd()<.5?'#b9c46a':'#d9bf6a'}" opacity=".75"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#crop)"/>`}
 if(c=='babel')m+=`<path d="M560,0 C585,120 595,250 575,380" stroke="#4f8fc6" stroke-width="26" fill="none"/><path d="M40,0 C20,140 30,250 15,380" stroke="#4f8fc6" stroke-width="16" fill="none" opacity=".9"/>`;
 if(c=='sur')m+=`<path d="M0,330 C150,310 450,320 600,300 L600,380 L0,380Z" fill="#3f86b5"/>`+[90,300,500].map(x=>`<text x="${x}" y="360" font-size="20">⛵</text>`).join('');
 if(c=='bakhtar'||c=='parsa'||c=='sardis'){const col=c=='bakhtar'?'#8e9bb0':'#a8977a';for(let i=0;i<9;i++){const x=i*75-10,h=40+rnd()*35;m+=POL(`${x},${0} ${x+45},${h} ${x+90},0`,col);if(c=='bakhtar')m+=POL(`${x+33},${h*.7} ${x+45},${h} ${x+57},${h*.7}`,'#f4f6fa')}}
 for(let i=0;i<60;i++){const x=rnd()*600,y=rnd()*380;if(!out(x,y))continue;m+=c=='babel'||c=='sur'||c=='susa'?`<text x="${x}" y="${y}" font-size="11">🌴</text>`:`<circle cx="${x}" cy="${y}" r="${4+rnd()*3}" fill="#5b7f3a"/><circle cx="${x+2}" cy="${y-2}" r="2.5" fill="#7a9f4f"/>`}
 const[wx,wy,ww,wh]=GC([22,22,556,336]);
 m+=`<rect x="${wx}" y="${wy}" width="${ww}" height="${wh}" rx="4" fill="${p.gr}" stroke="${p.wall}" stroke-width="7"/>`+[[wx,wy],[wx+ww,wy],[wx,wy+wh],[wx+ww,wy+wh]].map(([x,y])=>R(x-7,y-7,14,14,p.wall,'rx="2"')).join('')+R(wx,wy+wh/2-4,ww,8,'#e3d2a8')+R(wx+ww/2-4,wy,8,wh,'#e3d2a8')+R(wx+ww/2-12,wy+wh-6,24,12,p.roof);
 return m}
function citySVG(c){const A=ART[c]&&ARTOK[c]?ART[c]:null,P=propsOf(c),h=c==S.home;let m='';
 const conv=A?pc:GC,lay=A?A.lay:LAY,plots=A?A.plots:PLOTS;
 if(!A)m+=scenery(c);
 const ICON={temple:C[c].z=='temple'?'⚖️':c=='parsa'||c=='bakhtar'?'🔥':'🏛️',boss:BOSS[C[c].z][1],market:'🏺',yard:c=='sur'?'⛵':'🐪',biz:BIZ[c][1],house:P?'🏠':'🔑'};
 const hit=(on,r,ic,label,fill,dash,cls)=>{const[x,y,w,hh]=conv(r);return`<g class="bld hit" onclick="${on}"><rect class="hr" x="${x}" y="${y}" width="${w}" height="${hh}" rx="8" fill="${fill}" stroke="${dash?'#fff':A?'transparent':'#0004'}" stroke-width="1.5" ${dash?'stroke-dasharray="5 4"':''} vector-effect="non-scaling-stroke"/>${ic?`<text x="${x+w/2}" y="${y+hh/2+(A?0:4)}" text-anchor="middle" font-size="${A?18:hh>30?15:11}">${ic}</text>`:''}${plate(x+w/2,y+hh-6,label,cls)}</g>`};
 ['temple','boss','market','biz','yard'].forEach(k=>{m+=hit(k=='market'?"openS('market')":`bld('${k}')`,lay[k],A?'':ICON[k],bName(c,k),A?'transparent':k=='market'?PAL[c].acc+'55':PAL[c].wall)});
 m+=hit("bld('house')",lay.house,A?(P?'🏠':'🔑'):ICON.house,bName(c,'house'),P?'#f7d77a55':'#ffffff33',!P,P?'home':'');
 plots.forEach((r,i)=>{const pl=P&&P.plots[i];m+=hit(`openS('plot',${i})`,r,pl?PT[pl.t].ic:'',pl?PT[pl.t].n:(P?'زمین خالی':'زمین'),pl?'#9fd06a55':A?'#ffffff14':'url(#fld)',!pl,'sm')});
 const[yx,yy,yw]=conv(lay.yard);
 carAt(c).forEach((k,i)=>{m+=`<g class="bld" onclick="carTap(${k.id})" transform="translate(${yx+yw/2+(i-(carAt(c).length-1)/2)*34*PX},${yy+18*PX*1.4}) scale(${PX})"><circle r="15" fill="#fbf3e2" stroke="${k.id==S.selCar?'#a8501f':'#7a6a58'}" stroke-width="3"/><text y="6" text-anchor="middle" font-size="17">🐪</text><circle cx="12" cy="-12" r="8" fill="#a8501f"/><text x="12" y="-8" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">${k.id.toLocaleString('fa')}</text></g>`});
 return m+cityBadges(c,lay,conv)}

function closeS(){U.sheet=null;render()}
function cityTap(c){if(!S.home)return openS('choose',c);

function carTap(id){S.selCar=id;openS('car',id)}
function bld(k){openS(k=='market'?'market':'bld',k)}
function enter(c){S.selCity=c;S.view='city';U.sheet=null;U.pick=null;CAM.city=null;S.tgt=carAt(c).length&&c!=S.home?'car':'wh';render();const cm=cam();cm.z=1;cm.tx=(innerWidth-MW*BASE)/2;cm.ty=(innerHeight-MH*BASE)/2;applyCam();renderMap()}
function leave(){const c=S.selCity;S.view='world';U.sheet=null;render();focus(C[c].x,C[c].y);renderMap()}
function showCar(id){const k=carById(id);if(!k)return;U.sheet=null;S.selCar=id;S.view='world';render();const[x,y]=carPos(k);focus(x,y);renderMap()}
function pickDest(id){U.pick=id;U.sheet=null;S.view='world';render();const k=carById(id);if(k&&k.at){focus(C[k.at].x,C[k.at].y,1);renderMap()}}
function setDest(id,c){const k=carById(id);if(k){k.dest=c;openS('go',id)}}
function sendHere(id,c){const k=carById(id);if(!k||!k.at)return;k.dest=c;openS('go',id)}
function setQty(v){S.qty=v;render()}
function togglePlay(){S.speed=S.speed?0:U.sp;render()}

 if(k=='yard')return[(c=='sur'?'⛵ ':'🐪 ')+title,`<p>کاروان‌ها این‌جا می‌مانند، بار می‌زنند و راه می‌افتند. کاروان تازه، نگهبان و ارتقای کاروان هم این‌جاست.</p>`+(carAt(c).map(carCard).join('')||'<p class="m">کاروانی این‌جا نیست.</p>')+

function routeHTML(k){let h=`<h3>مسیر ثابت (خودکار)</h3><div class="m">کاروان ایستگاه‌ها را تکرار می‌کند: در هر ایستگاه بار را می‌فروشد و کالای انتخابی را می‌خرد؛ در شهر خانگی بار به انبار می‌رود.</div>`;

 if(!k.auto)h+='<div class="btns"><span class="m">افزودن ایستگاه:</span>'+ids.map(x=>`<button class="sm o" onclick="addStop(${k.id},'${x}')">${C[x].n}</button>`).join('')+'</div>';

  h+='<h3>کاروان‌ها</h3>'+S.cars.map(carCard).join('');
  h+=S.evs.length?'<h3>رویدادهای شهرها</h3>'+S.evs.map(evCard).join(''):'';
  if(S.order){const o=S.order;h+=`<h3>📜 فرمان شاه</h3><div class="card">${GI[o.g]} ${f(o.q)} بار ${G[o.g][0]} به انبار ${C[S.home].n} تا ${f(o.due-S.day)} روز دیگر؛ هر بار ${f(o.price)}.<div class="m">دارید: ${f(S.wh[o.g]?S.wh[o.g].q:0)}</div><button class="sm" onclick="deliver()" ${S.wh[o.g]&&S.wh[o.g].q>=o.q?'':'disabled'}>تحویل</button></div>`}
  h+=`<h3>شهرهای شما</h3>`+Object.keys(S.props).map(c=>`<div class="card tap" onclick="enter('${c}')"><b>🏠 ${C[c].n}</b>${c==S.home?' ★':''} <span class="m">انبار ${f(load(S.props[c].wh))}/${f(whCap(c))} · ${f(S.props[c].plots.filter(Boolean).length)} کارگاه</span></div>`).join('')}
 if(t=='cars')h+=S.cars.map(carCard).join('')+`<button class="wide" onclick="build('car','${S.home}')" ${S.gold<800?'disabled':''}>🐪 خرید کاروان تازه در ${C[S.home].n} (۸۰۰)</button><button class="wide o" onclick="build('guard')" ${S.guard||S.gold<300?'disabled':''}>🛡 نگهبان ${S.guard?'✓':'(۳۰۰)'}</button>`;
 if(t=='wh')h+=Object.keys(S.props).map(c=>`<div class="card"><b>${C[c].n}${c==S.home?' ★':''}</b> <span class="m">${f(load(S.props[c].wh))}/${f(whCap(c))}</span>${bar(load(S.props[c].wh),whCap(c))}${whCity(c)}</div>`).join('')+'<p class="m">«بهترین مقصد» بر اساس آخرین قیمت دیده‌شده (پس از عوارض) است.</p>';
 if(t=='prop')h+=Object.keys(S.props).map(c=>{const P=S.props[c];return`<div class="card"><b>🏠 ${C[c].n}</b>${c==S.home?' ★':''}<div class="m">سهم ${BIZ[c][0]}: ${f(P.shares)}</div>${P.plots.map(pl=>pl?`<div>${PT[pl.t].ic} ${PT[pl.t].n}${pl.t=='farm'?' ('+(pl.mode=='share'?'سهم‌بری':'اجاره')+')':''}</div>`:'').join('')||'<div class="m">هنوز کارگاهی نساخته‌اید.</div>'}<button class="sm o" onclick="enter('${c}')">رفتن به شهر</button></div>`}).join('')+'<p class="m">برای خرید خانه در شهر دیگر، کاروانتان را آن‌جا ببرید و روی «خانه برای فروش» بزنید.</p>';
 if(t=='ev'){h+=(S.evs.map(evCard).join('')||'<p class="m">فعلاً رویدادی نیست؛ جارچی‌ها هر چند روز خبر تازه می‌آورند.</p>');
  const pks=Object.keys(S.perks).filter(c=>pk(c).tax>=S.day||discF(c)<1);if(pks.length)h+='<h3>امتیازهای شما</h3>'+pks.map(c=>`<div class="row">${C[c].n}: ${pk(c).tax>=S.day?'معافیت عوارض تا روز '+f(pk(c).tax)+' ':''}${discF(c)<1?'· تخفیف '+f(pk(c).disc.pct)+'٪ تا روز '+f(pk(c).disc.until):''}</div>`).join('');
  if(S.clo.length)h+='<h3>قرضه‌های شما به شهرها</h3>'+S.clo.map(l=>`<div class="row"><div class="grow">${C[l.c].n} · ${l.n}<div class="m">${f(l.amt)} ← ${f(l.ret)} در روز ${f(l.due)}</div></div></div>`).join('')}
 if(t=='fin')h+=finHTML();
 if(t=='stats')h+=statsHTML();
 if(t=='news')h+='<div id="log">'+S.news.map(x=>'<div>'+x+'</div>').join('')+'</div>';
 if(t=='shop')h+=`<p class="m">نمونه آزمایشی: پرداخت واقعی هنوز وصل نیست و دکمه‌ها چیزی اضافه نمی‌کنند.</p>`+[['کیسه کوچک',500],['صندوق بازرگان',2500],['خزانه ساتراپ',12000]].map(([n,a])=>`<div class="row"><div class="grow"><b>${n}</b> · ${f(a)} دریک</div><button class="sm o" onclick="toast('پرداخت واقعی در نسخه نهایی وصل می‌شود.')">خرید</button></div>`).join('');
 return h}
function whCity(c){const W=S.props[c].wh,ks=Object.keys(W);if(!ks.length)return'<p class="m">خالی</p>';
 return ks.map(g=>{const e=W[g],p=price(c,g),d=p-e.c;let b=null;ids.forEach(x=>{const v=S.seen[x].p[g]*(1-taxRate(x));if(!b||v>b.v)b={c:x,v}});
  return`<div class="row"><span>${GI[g]}</span><div class="grow">${G[g][0]} <b>${f(e.q)}</b><div class="m">تمام‌شده ${f1(e.c)} · این‌جا ${f(p)} <span class="${d>=0?'dn':'up'}">(${d>=0?'+':''}${f1(d)})</span> · بهترین: ${C[b.c].n} ${f(b.v)}</div></div></div>`}).join('')}
function finHTML(){const L=S.loans||[];let h=`<div class="card">${kv('اعتبار نزد معبد','★'.repeat(S.rep)+'☆'.repeat(6-S.rep))}${kv('سقف وام',f(lim()))}${kv('بدهی',f(debts()))}</div>`;
 h+=L.map(l=>`<div class="card"><b>${l.kind=='temple'?'وام خزانه معبد':'قرارداد هرّانو'}</b> · اصل ${f(l.amt)} · ${f(l.due-S.day)} روز${l.late?' <span class="up">عقب‌افتاده</span>':''}<div>تسویه امروز: <b>${f(curOwed(l))}</b> <button class="sm" onclick="repay(${l.id})" ${S.gold<curOwed(l)?'disabled':''}>پرداخت</button></div></div>`).join('');
 const ok=!overdue(),b=(k,a)=>`<button class="sm o" ${ok&&principal()+a<=lim()?'':'disabled'} onclick="takeLoan('${k}',${a})">${f(a)}</button>`;
 h+=`<h3>وام از معبد</h3><div class="m">۵٪ سود برای ۶۰ روز. پرداخت به‌موقع اعتبار را بالا می‌برد؛ تأخیر ۲ ستاره کم می‌کند و معبد از انبارتان برمی‌دارد.</div><div class="btns">`+[500,1000,2000].map(a=>b('temple',a)).join('')+'</div>';
 h+=`<h3>هرّانو (شراکت سفر)</h3><div class="m">خاندان بازرگان سرمایه می‌دهد؛ ۴۰٪ سود مال او، و در ضرر نیمی از ضرر با اوست. ۴۵ روز.</div><div class="btns">`+[1000,2500].map(a=>b('harranu',a)).join('')+'</div>';
 h+=`<h3>سپرده در معبد</h3><div class="m">پول امن می‌ماند ولی ماهی ۱٪ کارمزد دارد. موجود: <b>${f(S.deposit)}</b></div><div class="btns"><button class="sm o" onclick="dep(500)">+۵۰۰</button><button class="sm o" onclick="dep(2000)">+۲۰۰۰</button><button class="sm o" onclick="wdr()" ${S.deposit?'':'disabled'}>برداشت همه</button></div>`;
 h+=`<h3>صرافی (نقره و دریک)</h3><div class="m">هر مثقال نقره = <b class="${S.rate>1?'up':'dn'}">${S.rate.toFixed(2).replace('.','٫')}</b> دریک (۲٪ کارمزد). موجود: ${f(S.silver)} مثقال</div><div class="btns"><button class="sm o" onclick="buySilver(500)">خرید با ۵۰۰</button><button class="sm o" onclick="sellSilver(500)" ${S.silver?'':'disabled'}>فروش ۵۰۰</button><button class="sm o" onclick="sellSilver(1e9)" ${S.silver?'':'disabled'}>فروش همه</button></div>`;
 return h}
function statsHTML(){const L=S.led,inv=invCost(),cap=S.gold+S.deposit+S.silver*S.rate+inv+S.clo.reduce((a,l)=>a+l.amt,0)-debts(),start=1000,tp=Object.values(S.pg).reduce((a,b)=>a+b,0);
 let h=`<div class="card">${kv('سرمایه اولیه',f(start))}${kv('صندوق (نقد)',f(S.gold))}${kv('پول در کالاها (قیمت تمام‌شده)',f(inv))}${kv('سپرده، نقره و قرضه به شهرها',f(S.deposit+S.silver*S.rate+S.clo.reduce((a,l)=>a+l.amt,0)))}${kv('بدهی',f(-debts()))}${kv('سرمایه کل کنونی',f(cap))}${kv('سود/زیان از ابتدا',(cap-start>=0?'+':'')+f(cap-start),cap-start>=0?'dn':'up')}</div>`;
 h+=`<h3>پول کجا رفت و از کجا آمد؟</h3><div class="card">${kv('سود فروش‌ها',(tp>=0?'+':'')+f(tp),tp>=0?'dn':'up')}${kv('سود قرضه به شهرها','+'+f(L.cityInt),'dn')}${kv('عوارض فروش',f(-L.tax),'up')}${kv('هزینه راه کاروان (با بار)',f(-L.freight),'up')}${kv('کاروان خالی در راه',f(-L.idle),'up')}${kv('دستمزد کارگاه',f(-L.wage),'up')}${kv('خراج ساتراپی',f(-L.tribute),'up')}${kv('جریمه‌ها',f(-L.fine),'up')}${kv('اعانه به معابد',f(-L.gift),'up')}${kv('بهره وام و کارمزد',f(-(L.interest+L.fee)),'up')}${kv('بار از دست رفته',f(-L.robbed),'up')}${kv('خرید دارایی و ارتقا',f(-L.invest),'up')}</div>`;
 const gs=Object.keys(S.pg);if(gs.length)h+='<h3>سود هر کالا</h3><div class="card">'+gs.map(g=>kv(GI[g]+' '+G[g][0],(S.pg[g]>=0?'+':'')+f(S.pg[g]),S.pg[g]>=0?'dn':'up')).join('')+'</div>';
 h+='<h3>آخرین معاملات</h3>'+(S.trades.length?S.trades.slice(0,25).map(t=>`<div class="row"><span>${GI[t.g]}</span><div class="grow">${t.t=='buy'?'خرید':'فروش'} ${f(t.q)} ${G[t.g][0]} در ${C[t.c].n}<div class="m">روز ${f(t.d)} · ${f(t.total)} دریک</div></div>${t.t=='sell'?`<b class="${t.profit>=0?'dn':'up'}">${t.profit>=0?'+':''}${f(t.profit)}</b>`:''}</div>`).join(''):'<p class="m">هنوز معامله‌ای نکرده‌اید.</p>');
 return h}
function menuHTML(){return`<button class="wide o" onclick="S.tut=!S.tut;render()">${S.tut?'پنهان کردن راهنمای بالای صفحه':'نمایش راهنمای بالای صفحه'}</button>
 <h3>راهنمای بازی</h3><ol><li>نقشه را با انگشت بکشید و با دو انگشت زوم کنید. انگشت را روی یک شهر نگه دارید تا خلاصه‌اش را ببینید؛ بزنید تا وارد شوید یا کاروان بفرستید.</li><li>در شهر روی ساختمان‌ها بزنید: بازار برای قیمت دقیق و خرید و فروش، کاروانسرا برای کاروان‌ها و ارتقا، معبد برای وام، کاخ یا شورا برای فرمان‌ها و جشن‌ها.</li><li>روی 🐪 بزنید، «انتخاب مقصد روی نقشه» را بزنید و شهر مقصد را لمس کنید.</li><li>📜 رویدادها: جشن‌های شاهی کالا را گران می‌خرند و حضور کاروان در روز جشن آوازه می‌دهد؛ معابد در اعیاد اعانه می‌خواهند و معافیت عوارض یا تخفیف زمین می‌دهند؛ شهرهای مرزی چوب و فلز می‌خرند یا قرض می‌گیرند.</li><li>بعد از چند سفر، کاروان را در هر شهر ارتقا دهید تا تندتر برود و بار بیشتری ببرد.</li><li>🏪 دکان من همه کسب‌وکارتان را یک‌جا نشان می‌دهد.</li></ol>
 <h3>بازی تازه</h3>${U.askReset?`<p class="up">همه پیشرفت پاک می‌شود. مطمئنید؟</p><button onclick="reset()">بله، از اول</button><button class="o" onclick="U.askReset=0;render()">نه</button>`:`<button class="o" onclick="U.askReset=1;render()">⟲ شروع دوباره</button>`}`}
function sheetContent(){const k=U.sheet,a=U.arg;
 if(k=='choose')return chooseHTML(a);if(k=='menu')return['☰ منو',menuHTML()];if(!S.home)return null;
 if(k=='city')return cityInfoHTML(a);if(k=='market')return['🏺 بازار '+C[S.selCity].n,marketHTML()];if(k=='bld')return bldHTML(a);if(k=='plot')return plotHTML(a);
 if(k=='car')return carHTML(a);if(k=='go')return goHTML(a);if(k=='ev')return evHTML(a);if(k=='dash')return['🏪 دکان من',dashHTML()];return null}
function renderSheet(){const sh=$('sheet'),r=U.sheet&&sheetContent();if(!r){sh.classList.remove('open');U.lastKey='';return}
 const html=`<div id="sheetHead"><div class="grab"></div><b>${r[0]}</b><button class="x" onclick="closeS()">✕</button></div><div id="sheetBody">${r[1]}</div>`,key=U.sheet+'|'+U.arg+'|'+(U.sheet=='dash'?U.dtab:'');
 if(html!==U.lastSheet){const sb=$('sheetBody'),top=sb&&key==U.lastKey?sb.scrollTop:0;sh.innerHTML=html;$('sheetBody').scrollTop=top;U.lastSheet=html}
 U.lastKey=key;sh.classList.add('open')}
/* ---------- نوار بالا، پایین، راهنما ---------- */
let lastHud='';
function hud(){let h;if(!S.home)h=`<div class="grp"><div class="chip title">دریک: راه‌های شاهی</div></div><div class="grp"><button class="chip ic" onclick="openS('menu')">☰</button></div>`;
 else h=`<div class="grp"><button class="chip" onclick="openS('dash','sum')">💰 <b>${f(S.gold)}</b></button><div class="chip">📅 ${f(S.day)}</div>${S.fame?`<div class="chip">👑 ${f(S.fame)}</div>`:''}</div><div class="grp"><button class="chip ic" onclick="togglePlay()">${S.speed?'⏸':'▶'}</button><button class="chip ic" onclick="cycleSpeed()">×${f(U.sp)}</button><button class="chip ic" onclick="openS('menu')">☰</button></div>`;
 if(h!=lastHud){$('hud').innerHTML=h;lastHud=h}}
function hint(){if(!S.home)return'🏺 شهر محل سکونت خود را انتخاب کنید: روی یکی از شهرهای نقشه بزنید.';
 const mov=S.cars.filter(c=>!c.at),hc=carAt(S.home),any=Object.keys(S.wh).length||S.cars.some(c=>Object.keys(c.cargo).length)||Object.keys(S.props).length>1;
 if(S.speed==0&&mov.length)return'⏸ زمان ایستاده است؛ دکمه ▶ بالا را بزنید.';
 if(!any&&!mov.length)return S.view=='city'?'روی «بازار» بزنید و کالای ارزان (سبز ▼) بخرید.':'روی شهر خودتان (★ '+C[S.home].n+') بزنید و وارد شهر شوید.';
 if(Object.keys(S.wh).length&&hc.some(c=>!Object.keys(c.cargo).length))return'کالا در انبار است: روی 🐪 بزنید، بار کنید و مقصد را روی نقشه انتخاب کنید.';
 if(hc.some(c=>Object.keys(c.cargo).length&&!c.auto))return'کاروان بار دارد: روی 🐪 بزنید و «انتخاب مقصد روی نقشه» را بزنید.';
 const r=S.cars.find(c=>c.at&&c.at!=S.home&&!c.auto);if(r)return r.name+' در '+C[r.at].n+' است؛ وارد شهر شوید و در بازار بفروشید.';
 if(mov.length)return'🐪 کاروان در راه است؛ با ×۲ زمان را تندتر کنید.';
 if(S.evs.length)return'📜 رویدادهای شهرها را ببینید؛ جشن‌ها کالا را گران می‌خرند.';
 return'هدف بعدی: «'+(RANKS[S.won+1]?RANKS[S.won+1][0]:'—')+'»'}
function banner(){const b=$('banner');
 if(U.pick){const k=carById(U.pick);b.className='pick';b.innerHTML=`<span>🗺 شهر مقصد ${k?k.name:''} را روی نقشه بزنید</span><button style="color:#ffd47a" onclick="U.pick=null;render()">✕</button>`;return}
 b.className='';b.innerHTML=S.tut||!S.home?`<span>${hint()}</span>${S.home?'<button onclick="S.tut=0;render()">✕</button>':''}`:''}
function dock(){const d=$('dock');if(!S.home||U.pick||(U.sheet&&innerWidth<900)){d.innerHTML='';return}const n=S.evs.length;
 d.innerHTML=`<button onclick="openS('dash','sum')"><span>🏪</span>دکان من</button><button onclick="openS('dash','cars')"><span>🐪</span>کاروان‌ها</button><button onclick="openS('dash','ev')"><span>📜</span>رویدادها${n?`<i>${f(n)}</i>`:''}</button>`+(S.view=='city'?`<button onclick="leave()"><span>🗺</span>نقشه جهان</button>`:`<button onclick="enter(S.home)"><span>🏛</span>شهر من</button>`)}
function toast(t){U.toast={t,until:Date.now()+3000};tickToast()}
function tickToast(){const el=$('toast');if(U.toast&&Date.now()<U.toast.until){if(el.textContent!=U.toast.t)el.textContent=U.toast.t;el.classList.add('on')}else el.classList.remove('on')}
function render(){hud();banner();dock();renderMap();renderSheet();
 $('ov').innerHTML=S.choice?`<div class="ov"><div class="box"><h3>${S.choice.title}</h3><p>${S.choice.text}</p>${S.choice.opts.map((t,i)=>`<button onclick="choose(${i})">${t}</button>`).join('')}</div></div>`:'';tickToast()}
function boot(){try{let s=JSON.parse(localStorage.getItem(KEY)||'null')||JSON.parse(localStorage.getItem('derik-v5')||'null');if(s&&(s.v==5||s.v==6)){S=s;migrate();if(S.home)S.wh=S.props[S.home].wh}}catch(e){S=null}
 if(!S)init();S.speed=0;layout();const c=S.home||'susa';if(S.view=='city'&&S.home)enter(S.selCity);else{render();focus(C[c].x,C[c].y);renderMap()}}
let last=performance.now();
setInterval(()=>{const n=performance.now(),dt=(n-last)/1000;last=n;if(S&&S.home&&S.speed>0&&!document.hidden&&!S.choice){step(dt*.5*S.speed);drawCars();hud()}tickToast()},100);
boot();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
